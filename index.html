<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Stream - Infernal Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Load hls.js for HLS (m3u8) playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root {
  /* AMOLED Black & Pure Red Theme */
  --void: #000000; /* True AMOLED Black */
  --abyss: #050000;
  --crust: #0A0000;
  --regolith: #100000;
  --rust-deep: #5a0a0e;
  --rust: #8a0c12;
  --copper: #B00710;
  --magma: #C40612;
  --lava: #E50914; /* Primary Bright Red */
  --ember: #FF1A1A;
  --flame: #FF3333;
  --solar: #FF4D4D;
  --aurora: #FF6666;
  --gold: #FBBF24;
  --honey: #FFD700;
  --cream: #FFFFFF;
  --starlight: #FFFFFF;
  --fog: #E5E5E5;
  --ash: #A1A1A1;
  --dust: #717171;
  --danger: #FF0000;
  --success: #10b981;

  /* Functional */
  --bg: var(--void);
  --bg-elevated: rgba(20, 0, 0, 0.5); /* Reddish glass */
  --bg-glass: rgba(229, 9, 20, 0.05);
  --accent: var(--lava);
  --accent-bright: var(--flame);
  --text: var(--starlight);
  --text-dim: var(--fog);
  --text-faint: var(--ash);
  --border: rgba(229, 9, 20, 0.2); /* Bright Red border */
  --border-hover: rgba(229, 9, 20, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: #000000; /* AMOLED Black */
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

/* Atmosphere Layers - Intense Red Glows on Black */
.atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.atmosphere::before {
  content: ''; position: absolute; inset: 0;
  background: 
    radial-gradient(ellipse 80% 70% at 15% 50%, rgba(229,9,20,0.15) 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 85% 20%, rgba(255,26,26,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 50% 60% at 50% 100%, rgba(180,7,16,0.12) 0%, transparent 45%);
}
.atmosphere::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 100% 50% at 50% 0%, rgba(255,51,51,0.05) 0%, transparent 50%);
}
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 9998; opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.02; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.4) 3px, rgba(0,0,0,0.4) 6px); }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(0,0,0,0.9) 100%); }

/* Login Portal */
.login-portal { position: fixed; inset: 0; z-index: 5000; background: #000000; backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; }
.login-box { background: rgba(10, 0, 0, 0.8); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 80px rgba(229,9,20,0.15); }
.login-box h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; letter-spacing: 4px; color: #FFFFFF; text-align: center; margin-bottom: 30px; text-transform: uppercase; text-shadow: 0 0 20px rgba(229,9,20,0.5); }
.login-input { width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 16px; outline: none; transition: all 0.3s ease; }
.login-input:focus { border-color: var(--lava); box-shadow: 0 0 0 3px rgba(229,9,20,0.2); }
.login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--magma), var(--lava)); border: none; border-radius: 12px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(229,9,20,0.5); }
.login-error { color: var(--danger); text-align: center; margin-top: 16px; font-size: 13px; display: none; }

/* Top Navigation - Liquid Glass */
.topbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255,255,255,0.03) inset;
}
.topbar-inner { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  height: 48px; 
  width: 100%; 
  padding: 0 40px; 
  position: relative;
}
.brand { display: flex; align-items: center; cursor: pointer; z-index: 2; }
.brand-name {
  font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900;
  letter-spacing: 4px; color: #FFFFFF; line-height: 1; text-transform: uppercase;
  text-shadow: 0 0 40px rgba(229,9,20,0.5);
}

/* Centered Navigation */
.navlinks { 
  display: flex; 
  align-items: center; 
  gap: 2px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20, 0, 0, 0.4);
  border: 1px solid var(--border);
  padding: 4px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  z-index: 1;
}
.navlink {
  position: relative; display: flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 20px; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--text-dim); font-size: 13px; font-weight: 500;
  border: none; background: transparent; font-family: 'Inter', sans-serif;
}
.navlink::after {
  content: ''; position: absolute; bottom: 4px; left: 50%;
  transform: translateX(-50%) scaleX(0); width: 16px; height: 2px;
  background: var(--lava); border-radius: 2px; transition: transform 0.3s ease;
}
.navlink:hover { color: var(--text); background: rgba(229,9,20,0.1); }
.navlink:hover::after { transform: translateX(-50%) scaleX(1); }
.navlink.active { color: #fff; background: linear-gradient(135deg, rgba(229,9,20,0.3), rgba(255,26,26,0.15)); }
.navlink.active::after { transform: translateX(-50%) scaleX(1); width: 20px; background: var(--flame); }
.navlink .badge { font-family: 'Space Grotesk', monospace; font-size: 9px; padding: 1px 6px; background: rgba(229,9,20,0.3); border-radius: 4px; color: var(--solar); min-width: 18px; text-align: center; font-weight: 600; }

/* Right Header Group */
.header-right { display: flex; align-items: center; gap: 12px; z-index: 2; }
.searchbox { position: relative; width: 260px; flex-shrink: 0; }
.searchbox input {
  width: 100%; padding: 8px 14px 8px 36px; 
  background: rgba(20, 0, 0, 0.4);
  border: 1px solid var(--border); 
  border-radius: 20px; color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 12px; outline: none;
  transition: border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease; 
  backdrop-filter: blur(10px);
}
.searchbox input::placeholder { color: var(--ash); font-weight: 300; }
.searchbox input:focus { 
  border-color: var(--lava); 
  box-shadow: 0 0 0 3px rgba(229,9,20,0.2), 0 0 25px rgba(229,9,20,0.2); 
  background: rgba(0, 0, 0, 0.8); 
}
.searchbox .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ash); pointer-events: none; }
.searchbox .icon svg { width: 14px; height: 14px; }

.logout-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); color: var(--ash); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
.logout-btn:hover { background: rgba(229,9,20,0.2); color: var(--flame); border-color: var(--lava); }
.logout-btn svg { width: 16px; height: 16px; }

/* Main Stage */
.stage { position: relative; z-index: 2; width: 100%; padding: 0 0 80px 0; margin-top: -48px; transition: padding-top 0.3s ease; }
.stage.pad-top { padding-top: 100px; } 

/* Hero */
.hero {
  position: relative; 
  width: 100vw;
  height: 100vh; 
  min-height: 600px;
  overflow: hidden; 
  display: none; 
  align-items: flex-end; 
  padding: 80px;
  background: #000000;
  isolation: isolate;
}
.hero.visible { display: flex; animation: heroReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes heroReveal { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 25% 70%, rgba(229,9,20,0.2) 0%, transparent 55%), radial-gradient(ellipse 50% 40% at 80% 25%, rgba(255,26,26,0.1) 0%, transparent 50%); z-index: 1; }
.hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(0deg, #000000 0%, rgba(0,0,0,0.6) 40%, transparent 100%); z-index: 2; }
.hero-backdrop { position: absolute; inset: 0; z-index: 0; opacity: 0.6; background-size: cover; background-position: center 20%; filter: saturate(0.8) contrast(1.15) brightness(0.8); mask-image: linear-gradient(0deg, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(0deg, black 20%, transparent 100%); }
.hero-body { position: relative; z-index: 3; max-width: 680px; padding-bottom: 40px; }
.hero-chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; background: rgba(229,9,20,0.15); border: 1px solid var(--border); border-radius: 24px; font-family: 'Space Grotesk', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: var(--flame); margin-bottom: 24px; backdrop-filter: blur(10px); }
.hero-chip::before { content: ''; width: 6px; height: 6px; background: var(--lava); border-radius: 50%; box-shadow: 0 0 10px var(--lava); animation: pulseGlow 2s infinite; }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px var(--lava); } 50% { box-shadow: 0 0 20px var(--lava), 0 0 30px rgba(229,9,20,0.5); } }
.hero-title { font-family: 'Orbitron', sans-serif; font-size: 64px; font-weight: 900; line-height: 1.05; margin-bottom: 18px; background: linear-gradient(135deg, #fff 0%, #fff 40%, var(--lava) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; }
.hero-meta { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; font-family: 'Space Grotesk', monospace; font-size: 13.5px; color: var(--fog); flex-wrap: wrap; }
.hero-meta .star { display: flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; }
.hero-meta .dot { width: 4px; height: 4px; background: var(--lava); border-radius: 50%; }
.hero-desc { font-size: 15.5px; line-height: 1.8; color: var(--text-dim); margin-bottom: 36px; max-width: 540px; font-weight: 300; }
.hero-acts { display: flex; gap: 16px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 14px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); border: none; outline: none; position: relative; overflow: hidden; letter-spacing: 0.3px; }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(255,255,255,0.12), transparent); transform: translateX(-100%); transition: transform 0.6s ease; }
.btn:hover::before { transform: translateX(100%); }
.btn-lava { background: linear-gradient(135deg, var(--magma), var(--lava), var(--flame)); color: #fff; box-shadow: 0 4px 24px rgba(229,9,20,0.5), 0 0 0 1px rgba(255,26,26,0.2), inset 0 1px 0 rgba(255,255,255,0.12); }
.btn-lava:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(229,9,20,0.6), 0 0 0 1px rgba(255,26,26,0.3), inset 0 1px 0 rgba(255,255,255,0.15); }
.btn-ghost { background: rgba(20, 0, 0, 0.5); color: var(--text); border: 1px solid var(--border); backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(229,9,20,0.15); border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

/* Categories & Grid */
.catbar { display: flex; gap: 10px; margin: 40px 0 36px 0; flex-wrap: wrap; align-items: center; width: 100%; padding: 0 40px; }
.catpill { padding: 10px 22px; border-radius: 12px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap; }
.catpill:hover { background: rgba(229,9,20,0.15); border-color: var(--border-hover); color: var(--text); transform: translateY(-1px); }
.catpill.active { background: linear-gradient(135deg, rgba(229,9,20,0.25), rgba(255,26,26,0.15)); border-color: var(--lava); color: #fff; box-shadow: 0 4px 20px rgba(229,9,20,0.2); }

.sec-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; width: 100%; padding: 0 40px; }
.sec-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; display: flex; align-items: center; gap: 12px; color: var(--text); }
.sec-title::before { content: ''; width: 5px; height: 24px; background: var(--lava); border-radius: 3px; box-shadow: 0 0 16px var(--lava); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px; margin-bottom: 64px; width: 100%; padding: 0 40px; }

/* Movie Card */
.card { position: relative; border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border); background: rgba(10, 0, 0, 0.5); }
.card:hover { transform: translateY(-12px) scale(1.02); border-color: var(--lava); box-shadow: 0 28px 56px rgba(0,0,0,0.8), 0 0 0 1px rgba(229,9,20,0.2), 0 0 80px rgba(229,9,20,0.15); }
.card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.card:hover .card-img { transform: scale(1.08); }
.card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.95) 100%); opacity: 0; transition: opacity 0.4s ease; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; z-index: 2; }
.card:hover .card-overlay { opacity: 1; }
.playbtn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--magma), var(--lava)); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; box-shadow: 0 6px 24px rgba(229,9,20,0.6), 0 0 0 4px rgba(229,9,20,0.1); transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
.card:hover .playbtn { transform: scale(1.12); box-shadow: 0 8px 32px rgba(229,9,20,0.8), 0 0 0 6px rgba(229,9,20,0.2); }
.playbtn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }
.card-badges { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: flex-start; z-index: 3; pointer-events: none; }
.badge-rate { display: flex; align-items: center; gap: 5px; padding: 6px 11px; background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); border-radius: 10px; font-family: 'Space Grotesk', monospace; font-size: 11.5px; font-weight: 700; color: var(--gold); border: 1px solid rgba(251,191,36,0.2); }
.badge-rate::before { content: ''; width: 7px; height: 7px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 8px var(--gold); }
.card-info { padding: 16px; }
.card-title { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-family: 'Space Grotesk', monospace; font-size: 11.5px; color: var(--ash); display: flex; align-items: center; gap: 10px; }
.card-meta .sep { width: 3px; height: 3px; background: var(--lava); border-radius: 50%; }
.card-fav { position: absolute; top: 14px; right: 14px; z-index: 5; width: 32px; height: 32px; border-radius: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s ease; opacity: 0; transform: scale(0.8); }
.card:hover .card-fav { opacity: 1; transform: scale(1); }
.card-fav:hover { background: rgba(229,9,20,0.4); border-color: var(--lava); }
.card-fav svg { width: 14px; height: 14px; }

/* Skeletons */
.skel-card { border-radius: 20px; overflow: hidden; background: rgba(10, 0, 0, 0.5); border: 1px solid var(--border); }
.skel-img { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, #100000 25%, rgba(229,9,20,0.1) 50%, #100000 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; }
.skel-line { height: 14px; margin: 14px 16px; border-radius: 7px; background: linear-gradient(90deg, #100000 25%, rgba(229,9,20,0.1) 50%, #100000 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; }
.skel-line.s { width: 55%; height: 10px; margin-top: 0; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Empty State */
.empty { 
  text-align: center; 
  padding: 100px 20px; 
  color: var(--ash); 
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.empty-icon { 
  width: 100px; 
  height: 100px; 
  margin: 0 auto 32px; 
  border-radius: 50%; 
  background: rgba(229, 9, 20, 0.05); 
  border: 1px solid var(--border); 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  color: var(--lava); 
  box-shadow: 0 0 40px rgba(229,9,20,0.1) inset;
}
.empty-icon span { font-size: 42px; filter: grayscale(0.3) opacity(0.8); }
.empty h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--fog); margin-bottom: 12px; letter-spacing: 2px; }
.empty p { font-size: 15px; max-width: 400px; margin: 0 auto; line-height: 1.7; color: var(--dust); }

/* Film Playing Page (Portal) */
.portal { display: none; position: fixed; inset: 0; background: #000000; z-index: 1000; overflow-y: auto; }
.portal.on { display: flex; animation: portalIn 0.4s ease; flex-direction: column; }
@keyframes portalIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

.portal-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); z-index: 10; }
.portal-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: #fff; display: flex; align-items: center; gap: 12px; }
.portal-x { width: 36px; height: 36px; border-radius: 10px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); color: var(--ash); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
.portal-x:hover { background: rgba(229,9,20,0.2); color: var(--flame); border-color: var(--lava); }

.portal-body { padding: 40px; max-width: 1400px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
.vframe { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
.vframe video { width: 100%; height: 100%; object-fit: contain; }
.vplaceholder { text-align: center; color: var(--ash); padding: 48px; }
.vplaceholder .vicon { width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 50%; background: rgba(229,9,20,0.1); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(229,9,20,0.1); }
.vplaceholder .vicon svg { width: 32px; height: 32px; fill: var(--lava); }
.vplaceholder h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--fog); margin-bottom: 10px; letter-spacing: 1.5px; }
.vplaceholder p { font-size: 14px; color: var(--dust); max-width: 340px; line-height: 1.7; margin: 0 auto; }

.player-info { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; width: 100%; flex-wrap: wrap; gap: 20px; }
.player-info h2 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--text); display: flex; align-items: center; gap: 10px; }
.player-info h2 span { color: var(--lava); }

.server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-width: 1400px; margin: 0 auto; width: 100%; }
.server-btn { padding: 14px 10px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 12px; color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-transform: capitalize; text-align: center; }
.server-btn:hover { background: rgba(229,9,20,0.15); border-color: var(--lava); color: var(--text); transform: translateY(-2px); }
.server-btn.active { background: linear-gradient(135deg, var(--magma), var(--lava)); border-color: var(--lava); color: #fff; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: var(--rust); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--lava); }

@media (max-width: 1024px) {
  .topbar-inner { padding: 0 28px; }
  .hero { padding: 40px; }
  .hero-title { font-size: 42px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .portal-body { padding: 20px; }
}
@media (max-width: 768px) {
  .topbar-inner { padding: 0 20px; }
  .brand-name { font-size: 16px; letter-spacing: 3px; }
  .navlinks { display: none; }
  .searchbox { width: 160px; }
  .hero { padding: 32px; }
  .hero-title { font-size: 32px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; padding: 0 20px; }
  .catbar, .sec-head { padding: 0 20px; }
  .player-info h2 { font-size: 20px; }
}
@media (max-width: 480px) {
  .topbar-inner { padding: 0 16px; }
  .brand-name { font-size: 14px; letter-spacing: 2px; }
  .searchbox { width: 120px; }
  .searchbox input { padding: 6px 10px 6px 30px; font-size: 11px; }
  .searchbox .icon { left: 10px; }
  .searchbox .icon svg { width: 12px; height: 12px; }
  .hero { padding: 24px 20px; }
  .hero-title { font-size: 26px; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 36px; padding: 0 16px; }
  .catbar, .sec-head { padding: 0 16px; }
}
</style>
</head>
<body>

<!-- Login Portal -->
<div id="loginPortal" class="login-portal">
  <div class="login-box">
    <h1>Z-Stream Access</h1>
    <input type="text" id="loginUser" class="login-input" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPass" class="login-input" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">Enter the Abyss</button>
    <div id="loginError" class="login-error">Invalid credentials. Try again.</div>
  </div>
</div>

<div class="atmosphere"></div>
<div class="grain"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<nav class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="switchView('main')">
      <div class="brand-name">Z-Stream</div>
    </div>
    <div class="navlinks">
      <button class="navlink active" data-view="main" onclick="switchView('main')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Main
      </button>
      <button class="navlink" data-view="films" onclick="switchView('films')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="7" x2="7" y1="3" y2="17"/><line x1="17" x2="17" y1="3" y2="17"/><line x1="2" x2="22" y1="9" y2="9"/><line x1="2" x2="22" y1="15" y2="15"/></svg>
        Films
      </button>
      <button class="navlink" data-view="series" onclick="switchView('series')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M15 7V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3"/></svg>
        Series
      </button>
      <button class="navlink" data-view="anime" onclick="switchView('anime')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/></svg>
        Anime
      </button>
      <button class="navlink" data-view="favorites" onclick="switchView('favorites')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        Favorites
        <span class="badge" id="favCount">0</span>
      </button>
      <button class="navlink" data-view="history" onclick="switchView('history')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        History
        <span class="badge" id="histCount">0</span>
      </button>
    </div>
    <div class="header-right">
      <div class="searchbox">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search the abyss..." autocomplete="off">
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="stage" id="stage">
  <div class="hero" id="hero">
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <div class="hero-body">
      <div class="hero-chip">Featured</div>
      <h1 class="hero-title" id="heroTitle"></h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-acts" id="heroActs"></div>
    </div>
  </div>

  <div class="catbar" id="catbar">
    <div class="catpill active" data-cat="all" onclick="filterCategory('all')">All</div>
    <div class="catpill" style="opacity:0.3">...</div>
    <div class="catpill" style="opacity:0.3">...</div>
    <div class="catpill" style="opacity:0.3">...</div>
  </div>

  <div id="sections"></div>

  <div class="empty" id="empty" style="display:none;">
    <div class="empty-icon">
      <span>😞</span>
    </div>
    <h3 id="emptyTitle">Empty</h3>
    <p id="emptyDesc">Nothing exists here yet.</p>
  </div>
</main>

<!-- Film Playing Page -->
<div class="portal" id="portal">
  <div class="portal-head">
    <div class="portal-title" id="portalTitle">Now Playing</div>
    <button class="portal-x" onclick="closePlayer()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="portal-body">
    <div class="vframe">
      <div class="vplaceholder" id="vplaceholder">
        <div class="vicon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <h3>Playback unavailable</h3>
        <p>Select a server below to start watching.</p>
      </div>
      <video id="uvideo" controls style="display:none"></video>
    </div>
    
    <div class="player-info">
      <h2>Now Playing <span id="nowPlayingTitle">Loading...</span></h2>
      <button class="btn btn-ghost" id="playerFavBtn" onclick="togglePlayerFav()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        Favorite
      </button>
    </div>

    <div class="server-grid" id="nodelist">
      <!-- Servers injected via JS -->
    </div>
  </div>
</div>

<script>
const API_BASE = '/api';
const atm = document.querySelector('.atmosphere');
for (let i = 0; i < 80; i++) {
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.left = Math.random() * 100 + '%';
  d.style.top = Math.random() * 100 + '%';
  d.style.width = (1 + Math.random() * 3) + 'px';
  d.style.height = d.style.width;
  d.style.animationDelay = Math.random() * 25 + 's';
  d.style.animationDuration = (18 + Math.random() * 20) + 's';
  d.style.opacity = Math.random() * 0.4;
  atm.appendChild(d);
}

// --- AUTH SYSTEM (Connected to TiDB via Backend) ---
function checkAuth() {
  if (localStorage.getItem('zs_auth') !== 'true') {
    document.getElementById('loginPortal').style.display = 'flex';
  } else {
    document.getElementById('loginPortal').style.display = 'none';
  }
}

async function doLogin() {
  const u = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPass').value;
  
  try {
    // Send login request to Node.js backend
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await response.json();
    
    if (data.success) {
      localStorage.setItem('zs_auth', 'true');
      document.getElementById('loginPortal').style.display = 'none';
      init(); // Load movies after login
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  } catch (err) {
    console.error('Login error:', err);
    document.getElementById('loginError').style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('zs_auth');
  location.reload();
}

// Check auth on load
checkAuth();

// --- CACHE SYSTEM ---
const Cache = {
  get(k) { try { return JSON.parse(localStorage.getItem('hs_' + k)) || []; } catch { return []; } },
  set(k, v) { localStorage.setItem('hs_' + k, JSON.stringify(v)); },
  add(k, item) { const d = this.get(k); if (!d.find(x => x.id === item.id)) { d.unshift(item); this.set(k, d); } this.updateCounts(); },
  remove(k, id) { this.set(k, this.get(k).filter(x => x.id !== id)); this.updateCounts(); },
  has(k, id) { return this.get(k).some(x => x.id === id); },
  updateCounts() {
    const f = document.getElementById('favCount'), h = document.getElementById('histCount');
    if (f) f.textContent = this.get('fav').length;
    if (h) h.textContent = this.get('hist').length;
  }
};
Cache.updateCounts();

let view = 'main', cat = 'all', allMovies = [], allCats = [], featured = null;
let currentMovie = null;
let hls = null; 
const stage = document.getElementById('stage');

function switchView(v) {
  view = v;
  document.querySelectorAll('.navlink').forEach(l => l.classList.remove('active'));
  document.querySelector(`.navlink[data-view="${v}"]`)?.classList.add('active');
  document.getElementById('hero').classList.remove('visible');
  document.getElementById('catbar').style.display = 'none';
  document.getElementById('sections').innerHTML = '';
  document.getElementById('empty').style.display = 'none';
  
  // Apply padding to all views EXCEPT main (which uses the full-screen hero)
  if (v === 'main') {
    stage.classList.remove('pad-top');
  } else {
    stage.classList.add('pad-top');
  }
  
  if (view === 'main') {
    document.getElementById('catbar').style.display = 'flex';
    if (featured) renderHero(featured);
    renderSections(allMovies, allCats);
  } else if (view === 'favorites') {
    const favs = Cache.get('fav');
    if (favs.length === 0) showEmpty('Favorites Empty', 'Click the heart icon on movie cards to add them here.');
    else renderSection('Favorites', favs);
  } else if (view === 'history') {
    const hist = Cache.get('hist');
    if (hist.length === 0) showEmpty('History Empty', 'You haven\'t watched anything yet.');
    else renderSection('Recently Watched', hist);
  } else if (view === 'films' || view === 'series' || view === 'anime') {
    const filtered = allMovies.filter(m => m.type === view);
    if (filtered.length === 0) showEmpty('No Content', `No ${view} found.`);
    else renderSection(null, filtered); 
  }
}

function showEmpty(t, d) {
  document.getElementById('emptyTitle').textContent = t;
  document.getElementById('emptyDesc').textContent = d;
  document.getElementById('empty').style.display = 'flex';
}

// --- REAL API FUNCTIONS (Connected to Node.js Backend) ---
async function fetchMovies() {
  try {
    const r = await fetch(`${API_BASE}/movies`);
    if (!r.ok) return [];
    return r.json();
  } catch (e) { console.error('Failed to fetch movies:', e); return []; }
}

async function fetchCats() {
  try {
    const r = await fetch(`${API_BASE}/categories`);
    if (!r.ok) return [{id:'all', name:'All'}];
    return r.json();
  } catch (e) { return [{id:'all', name:'All'}]; }
}

async function fetchSources(id) {
  try {
    const r = await fetch(`${API_BASE}/sources?id=${id}`);
    if (!r.ok) return [];
    return r.json();
  } catch (e) { return []; }
}

function renderHero(m) {
  document.getElementById('heroBackdrop').style.backgroundImage = `url('${m.backdrop}')`;
  document.getElementById('heroTitle').textContent = m.title.toUpperCase();
  document.getElementById('heroMeta').innerHTML = `<span class="star"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${m.rating}</span><span class="dot"></span><span>${m.year}</span><span class="dot"></span><span>${m.genre}</span>`;
  document.getElementById('heroDesc').textContent = m.overview;
  const safe = m.title.replace(/'/g, "\'");
  document.getElementById('heroActs').innerHTML = `<button class="btn btn-lava" onclick="openPlayer('${safe}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>Watch Now</button><button class="btn btn-ghost" onclick="toggleFav(${m.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="${Cache.has('fav',m.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>${Cache.has('fav',m.id)?'In Favorites':'Add to Favorites'}</button>`;
  document.getElementById('hero').classList.add('visible');
}

function renderCats(cats) {
  document.getElementById('catbar').innerHTML = cats.map(c => `<div class="catpill ${c.id==='all'?'active':''}" data-cat="${c.id}" onclick="filterCategory('${c.id}')">${c.name}</div>`).join('');
}

function skel(count=6) { return Array(count).fill(0).map(()=>`<div class="skel-card"><div class="skel-img"></div><div class="skel-line"></div><div class="skel-line s"></div></div>`).join(''); }

function card(m) {
  const safe = m.title.replace(/'/g,"\'");
  const fav = Cache.has('fav', m.id);
  return `<div class="card"><div style="position:relative;overflow:hidden;" onclick="openPlayer('${safe}')"><img src="${m.poster}" class="card-img" alt="${m.title}" loading="lazy"><div class="card-badges"><div class="badge-rate">${m.rating}</div></div><div class="card-overlay"><div class="playbtn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div></div><button class="card-fav" onclick="event.stopPropagation();toggleFav(${m.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button><div class="card-info"><div class="card-title">${m.title}</div><div class="card-meta"><span>${m.year}</span><span class="sep"></span><span>${m.genre}</span></div></div></div>`;
}

function renderSection(title, movies, sid='') {
  const id = sid || 's_' + Math.random().toString(36).substr(2, 9);
  const headerHtml = title ? `<div class="sec-head"><h2 class="sec-title">${title}</h2></div>` : '';
  document.getElementById('sections').insertAdjacentHTML('beforeend', `${headerHtml}<div class="grid" id="${id}">${movies.length>0?movies.map(card).join(''):skel()}</div>`);
}

function renderSections(movies, cats) {
  document.getElementById('sections').innerHTML = '';
  if (cat !== 'all') { 
    // Filter movies where the genre name matches the selected category name
    const f = movies.filter(m => m.genre === cat); 
    renderSection(cat, f); 
    return; 
  }
  const gmap = {}; movies.forEach(m => { if(!gmap[m.genre]) gmap[m.genre]=[]; gmap[m.genre].push(m); });
  Object.entries(gmap).forEach(([g,items]) => renderSection(g, items));
}

function filterCategory(cid) {
  cat = cid;
  document.querySelectorAll('.catpill').forEach(t => t.classList.remove('active'));
  document.querySelector(`.catpill[data-cat="${cid}"]`)?.classList.add('active');
  if (view === 'main') renderSections(allMovies, allCats);
}

function toggleFav(id) {
  const m = allMovies.find(x => x.id === id);
  if (!m) return;
  if (Cache.has('fav', id)) Cache.remove('fav', id); else Cache.add('fav', m);
  if (view === 'favorites') switchView('favorites');
  else if (view === 'main') { if (featured && featured.id === id) renderHero(featured); renderSections(allMovies, allCats); }
  if (currentMovie && currentMovie.id === id) updatePlayerFavBtn();
}

// --- PLAYER LOGIC ---

let dynamicSources = [];

async function openPlayer(title) {
  currentMovie = allMovies.find(x => x.title === title);
  if (currentMovie) Cache.add('hist', currentMovie);
  
  document.getElementById('nowPlayingTitle').textContent = title;
  document.getElementById('portalTitle').textContent = title.toUpperCase();
  document.getElementById('portal').classList.add('on');
  document.body.style.overflow = 'hidden';
  
  const v = document.getElementById('uvideo');
  v.pause(); v.src = ''; v.style.display = 'none';
  document.getElementById('vplaceholder').style.display = 'block';
  
  // Fetch sources dynamically from backend
  dynamicSources = await fetchSources(currentMovie?.id);

  // Generate server buttons
  document.getElementById('nodelist').innerHTML = dynamicSources.length > 0 
    ? dynamicSources.map((s, i) => `<div class="server-btn ${i===0?'active':''}" onclick="selSrc(this, '${s.name}')">${s.name}</div>`).join('')
    : '<p style="color: var(--ash); text-align: center; grid-column: 1/-1;">No sources found for this title.</p>';

  // Auto-select the first source if it exists
  if (dynamicSources.length > 0) {
    selSrc(document.querySelector('.server-btn'), dynamicSources[0].name);
  }

  updatePlayerFavBtn();
}

function updatePlayerFavBtn() {
  const btn = document.getElementById('playerFavBtn');
  if (!currentMovie) return;
  const isFav = Cache.has('fav', currentMovie.id);
  if (isFav) {
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> Favorited`;
  } else {
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> Favorite`;
  }
}

function togglePlayerFav() {
  if (!currentMovie) return;
  toggleFav(currentMovie.id);
}

function selSrc(btn, serverName) {
  if (!btn) return;
  
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const source = dynamicSources.find(s => s.name === serverName);
  if (!source) return;

  const video = document.getElementById('uvideo');
  const placeholder = document.getElementById('vplaceholder');
  placeholder.style.display = 'none';
  video.style.display = 'block';

  if (hls) {
    hls.destroy();
    hls = null;
  }

  // Dynamically detect format (HLS vs MP4) just before playing
  if (source.url.includes('.m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(source.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = source.url;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    }
  } 
  else if (source.url.includes('.mp4')) {
    video.src = source.url;
    video.play();
  } else {
    // Fallback for direct embeds or unknown formats
    video.src = source.url;
    video.play();
  }
}

function closePlayer() {
  document.getElementById('portal').classList.remove('on');
  document.body.style.overflow = '';
  const v = document.getElementById('uvideo');
  v.pause(); v.src = '';
  if (hls) {
    hls.destroy();
    hls = null;
  }
  currentMovie = null;
}

document.addEventListener('keydown', e => { if (e.key==='Escape') closePlayer(); });

async function init() {
  document.getElementById('sections').innerHTML = `<div class="sec-head"><h2 class="sec-title">Summoning...</h2></div><div class="grid">${skel(6)}</div>`;
  const [movies, cats] = await Promise.all([fetchMovies(), fetchCats()]);
  allMovies = movies; allCats = cats;
  featured = movies.length > 0 ? movies[Math.floor(Math.random()*movies.length)] : null;
  renderCats(cats);
  if (featured) renderHero(featured);
  renderSections(allMovies, cats);
}

// Initialize the app (fetch movies in background even if behind login portal)
init();
</script>
</body>
