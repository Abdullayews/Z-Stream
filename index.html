<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Stream - Infernal Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #000000; --abyss: #050000; --crust: #0A0000; --regolith: #100000;
  --rust-deep: #5a0a0e; --rust: #8a0c12; --copper: #B00710; --magma: #C40612;
  --lava: #E50914; --ember: #FF1A1A; --flame: #FF3333; --solar: #FF4D4D;
  --aurora: #FF6666; --gold: #FBBF24; --honey: #FFD700; --cream: #FFFFFF;
  --starlight: #FFFFFF; --fog: #E5E5E5; --ash: #A1A1A1; --dust: #717171;
  --danger: #FF0000; --success: #10b981;
  --bg: var(--void); --bg-elevated: rgba(20, 0, 0, 0.5); --bg-glass: rgba(229, 9, 20, 0.05);
  --accent: var(--lava); --text: var(--starlight); --text-dim: var(--fog);
  --border: rgba(229, 9, 20, 0.2); --border-hover: rgba(229, 9, 20, 0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: #000000; color: var(--text); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

.atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.atmosphere::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 15% 50%, rgba(229,9,20,0.15) 0%, transparent 55%), radial-gradient(ellipse 60% 50% at 85% 20%, rgba(255,26,26,0.08) 0%, transparent 50%); }
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 9998; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(0,0,0,0.9) 100%); }

/* ── Login ── */
.login-portal { position: fixed; inset: 0; z-index: 5000; background: #000000; backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; }
.login-box { background: rgba(10, 0, 0, 0.8); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 80px rgba(229,9,20,0.15); }
.login-box h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; letter-spacing: 4px; color: #FFFFFF; text-align: center; margin-bottom: 30px; text-transform: uppercase; text-shadow: 0 0 20px rgba(229,9,20,0.5); }
.login-input { width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; transition: all 0.3s ease; }
.login-input:focus { border-color: var(--lava); box-shadow: 0 0 0 3px rgba(229,9,20,0.2); }
.login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--magma), var(--lava)); border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(229,9,20,0.5); }
.login-btn:disabled { opacity: 0.6; cursor: wait; }
.login-error { color: var(--danger); text-align: center; margin-top: 16px; font-size: 13px; display: none; line-height: 1.6; }
.login-error a { color: var(--solar); text-decoration: underline; }
.login-status { display: none; background: rgba(229,9,20,0.08); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: var(--solar); margin-bottom: 16px; line-height: 1.5; }
.login-status a { color: var(--flame); text-decoration: underline; }
.login-hint { text-align: center; font-size: 11.5px; color: var(--dust); margin-top: 18px; }
.login-hint b { color: var(--ash); }

/* ── Topbar ── */
.topbar { position: sticky; top: 0; z-index: 200; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(30px) saturate(180%); border-bottom: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 48px; width: 100%; padding: 0 40px; position: relative; }
.brand { display: flex; align-items: center; cursor: pointer; z-index: 2; }
.brand-name { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 4px; color: #FFFFFF; text-transform: uppercase; text-shadow: 0 0 40px rgba(229,9,20,0.5); }

.navlinks { display: flex; align-items: center; gap: 2px; position: absolute; left: 50%; transform: translateX(-50%); background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); padding: 4px; border-radius: 30px; backdrop-filter: blur(10px); z-index: 1; }
.navlink { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: all 0.3s; color: var(--text-dim); font-size: 13px; font-weight: 500; border: none; background: transparent; }
.navlink::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%) scaleX(0); width: 16px; height: 2px; background: var(--lava); border-radius: 2px; transition: transform 0.3s ease; }
.navlink:hover { color: var(--text); background: rgba(229,9,20,0.1); }
.navlink:hover::after { transform: translateX(-50%) scaleX(1); }
.navlink.active { color: #fff; background: linear-gradient(135deg, rgba(229,9,20,0.3), rgba(255,26,26,0.15)); }
.navlink.active::after { transform: translateX(-50%) scaleX(1); width: 20px; background: var(--flame); }
.navlink .badge { font-family: 'Space Grotesk', monospace; font-size: 9px; padding: 1px 6px; background: rgba(229,9,20,0.3); border-radius: 4px; color: var(--solar); min-width: 18px; text-align: center; }

.header-right { display: flex; align-items: center; gap: 12px; z-index: 2; position: relative; }
.searchbox { position: relative; width: 260px; flex-shrink: 0; }
.searchbox input { width: 100%; padding: 8px 14px 8px 36px; background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 12px; outline: none; transition: all 0.35s ease; backdrop-filter: blur(10px); }
.searchbox input:focus { border-color: var(--lava); box-shadow: 0 0 0 3px rgba(229,9,20,0.2); background: rgba(0, 0, 0, 0.8); }
.searchbox .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ash); pointer-events: none; }

.search-dropdown { position: absolute; top: 100%; right: 0; width: 100%; margin-top: 8px; background: rgba(10, 0, 0, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); max-height: 400px; overflow-y: auto; z-index: 100; padding: 8px; display: none; }
.search-item { display: flex; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
.search-item:hover { background: rgba(229, 9, 20, 0.1); }
.search-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 6px; background: #111; flex-shrink: 0; }
.search-item-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.search-item-title { color: var(--text); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-item-meta { color: var(--ash); font-size: 12px; display: flex; align-items: center; }
.type-tag { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--solar); background: rgba(229,9,20,0.15); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; margin-right: 8px; }

.logout-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); color: var(--ash); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
.logout-btn:hover { background: rgba(229,9,20,0.2); color: var(--flame); border-color: var(--lava); }

/* ── Stage / Hero ── */
.stage { position: relative; z-index: 2; width: 100%; padding: 0 0 80px 0; margin-top: -48px; transition: padding-top 0.3s ease; }
.stage.pad-top { padding-top: 100px; }

.hero { position: relative; width: 100vw; height: 100vh; min-height: 600px; overflow: hidden; display: none; align-items: flex-end; padding: 80px; background: #000000; isolation: isolate; }
.hero.visible { display: flex; animation: heroReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes heroReveal { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 25% 70%, rgba(229,9,20,0.2) 0%, transparent 55%); z-index: 1; }
.hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(0deg, #000000 0%, rgba(0,0,0,0.6) 40%, transparent 100%); z-index: 2; }
.hero-backdrop { position: absolute; inset: 0; z-index: 0; opacity: 0.6; background-size: cover; background-position: center 20%; filter: saturate(0.8) contrast(1.15) brightness(0.8); mask-image: linear-gradient(0deg, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(0deg, black 20%, transparent 100%); }
.hero-body { position: relative; z-index: 3; max-width: 680px; padding-bottom: 60px; }
.hero-chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; background: rgba(229,9,20,0.15); border: 1px solid var(--border); border-radius: 24px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: var(--flame); margin-bottom: 24px; backdrop-filter: blur(10px); }
.hero-chip::before { content: ''; width: 6px; height: 6px; background: var(--lava); border-radius: 50%; box-shadow: 0 0 10px var(--lava); animation: pulseGlow 2s infinite; }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px var(--lava); } 50% { box-shadow: 0 0 20px var(--lava), 0 0 30px rgba(229,9,20,0.5); } }
.hero-title { font-family: 'Orbitron', sans-serif; font-size: 64px; font-weight: 900; line-height: 1.05; margin-bottom: 18px; background: linear-gradient(135deg, #fff 0%, #fff 40%, var(--lava) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; }
.hero-meta { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; font-size: 13.5px; color: var(--fog); flex-wrap: wrap; }
.hero-meta .star { display: flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; }
.hero-meta .dot { width: 4px; height: 4px; background: var(--lava); border-radius: 50%; }
.hero-desc { font-size: 15.5px; line-height: 1.8; color: var(--text-dim); margin-bottom: 36px; max-width: 540px; font-weight: 300; }
.hero-acts { display: flex; gap: 16px; flex-wrap: wrap; }

.hero-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 48px; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 4; user-select: none; transition: color 0.2s; padding: 0 20px; font-weight: 300; }
.hero-arrow:hover { color: var(--lava); }
.hero-arrow.left { left: 0; }
.hero-arrow.right { right: 0; }
.hero-dots { position: absolute; bottom: 40px; left: 80px; display: flex; gap: 8px; z-index: 4; }
.hero-dot { width: 32px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; transition: all 0.3s; }
.hero-dot:hover { background: rgba(255,255,255,0.4); }
.hero-dot.active { background: var(--lava); box-shadow: 0 0 12px var(--lava); width: 48px; }

.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); border: none; outline: none; position: relative; overflow: hidden; }
.btn-lava { background: linear-gradient(135deg, var(--magma), var(--lava), var(--flame)); color: #fff; box-shadow: 0 4px 24px rgba(229,9,20,0.5); }
.btn-lava:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(229,9,20,0.6); }
.btn-ghost { background: rgba(20, 0, 0, 0.5); color: var(--text); border: 1px solid var(--border); backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(229,9,20,0.15); border-color: var(--border-hover); transform: translateY(-2px); }

/* ── Category bar ── */
.catbar { display: flex; gap: 10px; margin: 40px 0 36px 0; flex-wrap: wrap; width: 100%; padding: 0 40px; }
.catpill { padding: 10px 22px; border-radius: 12px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); color: var(--text-dim); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
.catpill:hover { background: rgba(229,9,20,0.15); color: var(--text); transform: translateY(-1px); }
.catpill.active { background: linear-gradient(135deg, rgba(229,9,20,0.25), rgba(255,26,26,0.15)); border-color: var(--lava); color: #fff; }

/* ── Sections — strict 5×2 grid (20 items per category on home) ── */
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; width: 100%; padding: 0 40px; }
.sec-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
.sec-title::before { content: ''; width: 5px; height: 24px; background: var(--lava); border-radius: 3px; box-shadow: 0 0 16px var(--lava); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px 20px; margin-bottom: 64px; width: 100%; padding: 0 40px; }
@media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 950px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; } }

/* ── Cards ── */
.card { position: relative; border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border); background: rgba(10, 0, 0, 0.5); }
.card:hover { transform: translateY(-12px) scale(1.02); border-color: var(--lava); box-shadow: 0 28px 56px rgba(0,0,0,0.8), 0 0 0 1px rgba(229,9,20,0.2), 0 0 80px rgba(229,9,20,0.15); }
.card-media { position: relative; overflow: hidden; }
.card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; transition: transform 0.6s; }
.card:hover .card-img { transform: scale(1.08); }
.card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.95) 100%); opacity: 0; transition: opacity 0.4s; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; z-index: 2; }
.card:hover .card-overlay { opacity: 1; }
.playbtn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--magma), var(--lava)); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; box-shadow: 0 6px 24px rgba(229,9,20,0.6); transition: all 0.35s; }
.card:hover .playbtn { transform: scale(1.12); }
.playbtn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }
.card-badges { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: flex-start; z-index: 3; pointer-events: none; }
.badge-rate { display: flex; align-items: center; gap: 5px; padding: 6px 11px; background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); border-radius: 10px; font-size: 11.5px; font-weight: 700; color: var(--gold); }
.badge-rate::before { content: ''; width: 7px; height: 7px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 8px var(--gold); }
.card-info { padding: 16px; }
.card-title { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 11.5px; color: var(--ash); display: flex; align-items: center; gap: 10px; }
.card-meta .sep { width: 3px; height: 3px; background: var(--lava); border-radius: 50%; flex-shrink: 0; }
.card-fav { position: absolute; top: 14px; right: 14px; z-index: 5; width: 32px; height: 32px; border-radius: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s; opacity: 0; transform: scale(0.8); color: var(--ash); }
.card:hover .card-fav { opacity: 1; transform: scale(1); }
.card-fav:hover { background: rgba(229,9,20,0.4); border-color: var(--lava); }
.card-fav.active { color: var(--lava); }

.skel-card { border-radius: 20px; overflow: hidden; background: rgba(10, 0, 0, 0.5); border: 1px solid var(--border); }
.skel-img { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, #100000 25%, rgba(229,9,20,0.1) 50%, #100000 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; }
.skel-line { height: 14px; margin: 14px 16px; border-radius: 7px; background: linear-gradient(90deg, #100000 25%, rgba(229,9,20,0.1) 50%, #100000 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; }
.skel-line.s { width: 55%; height: 10px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.empty { text-align: center; padding: 100px 20px; color: var(--ash); min-height: 70vh; display: none; flex-direction: column; justify-content: center; align-items: center; }
.empty h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--fog); margin-bottom: 12px; }
.empty p { font-size: 15px; max-width: 400px; color: var(--dust); }

/* ── PLAYER — fits the screen, no white gaps ── */
.portal { display: none; position: fixed; inset: 0; background: #000000; z-index: 1000; overflow: hidden; }
.portal.on { display: flex; flex-direction: column; }
.portal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; flex-shrink: 0; }
.portal-title { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--fog); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.portal-x { background: transparent; border: none; color: var(--ash); cursor: pointer; transition: color 0.2s; flex-shrink: 0; }
.portal-x:hover { color: var(--lava); }
.portal-x svg { width: 28px; height: 28px; }

.portal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 40px 48px; max-width: 1600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.vframe { position: relative; width: min(100%, calc((100vh - 170px) * 16 / 9)); max-height: calc(100vh - 170px); aspect-ratio: 16 / 9; margin: 0 auto; flex-shrink: 0; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
@supports (height: 100dvh) {
  .vframe { width: min(100%, calc((100dvh - 170px) * 16 / 9)); max-height: calc(100dvh - 170px); }
}
.vframe iframe { width: 100%; height: 100%; border: none; display: block; background: #000; position: relative; z-index: 1; }
.vplaceholder { position: absolute; inset: 0; z-index: 3; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--ash); padding: 24px; }
.vplaceholder p { font-size: 14px; max-width: 420px; }
.spinner { width: 42px; height: 42px; border: 3px solid rgba(229,9,20,0.2); border-top-color: var(--lava); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sub-head { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; color: var(--fog); }
.sub-head::before { content: ''; width: 4px; height: 18px; background: var(--lava); border-radius: 2px; box-shadow: 0 0 12px var(--lava); }

.server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.server-btn { padding: 14px 10px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s; text-transform: capitalize; text-align: center; }
.server-btn:hover { background: rgba(229,9,20,0.15); color: var(--text); transform: translateY(-2px); }
.server-btn.active { background: linear-gradient(135deg, var(--magma), var(--lava)); color: #fff; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }
.src-note { color: var(--ash); font-size: 13px; text-align: center; grid-column: 1 / -1; padding: 12px; }

.info-row { display: flex; gap: 24px; background: rgba(10, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.info-poster { width: 140px; height: 210px; object-fit: cover; border-radius: 12px; flex-shrink: 0; background: #111; }
.info-details { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.info-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 16px; }
.info-title { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--text); line-height: 1.3; }
.info-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; color: var(--ash); flex-wrap: wrap; }
.info-meta .star { color: var(--gold); display: flex; align-items: center; gap: 4px; }
.info-desc { font-size: 14px; line-height: 1.7; color: var(--text-dim); max-height: 160px; overflow-y: auto; padding-right: 6px; }
.heart-btn { background: transparent; border: none; cursor: pointer; color: var(--ash); transition: color 0.2s; padding: 0; flex-shrink: 0; }
.heart-btn:hover { color: var(--flame); }
.heart-btn.active { color: var(--lava); }
.heart-btn svg { width: 28px; height: 28px; }

.episodes-section { display: flex; flex-direction: column; gap: 16px; }
.seasons-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.season-pill { padding: 8px 16px; background: rgba(20,0,0,0.5); border: 1px solid var(--border); border-radius: 20px; color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all 0.2s; }
.season-pill:hover { border-color: var(--border-hover); color: var(--text); }
.season-pill.active { background: var(--lava); border-color: var(--lava); color: #fff; }
.episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
.ep-btn { padding: 12px; background: rgba(20,0,0,0.5); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
.ep-btn:hover { border-color: var(--lava); background: rgba(229,9,20,0.1); }
.ep-btn.active { background: var(--lava); border-color: var(--lava); color: #fff; }

/* ── Sync panel ── */
.sync-panel { position: fixed; bottom: 20px; right: 20px; background: rgba(10, 0, 0, 0.9); border: 1px solid var(--border); backdrop-filter: blur(20px); padding: 20px; border-radius: 16px; z-index: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; min-width: 300px; }
.sync-panel h4 { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--lava); margin-bottom: 10px; text-transform: uppercase; }
.sync-panel p { font-size: 12px; color: var(--fog); margin-bottom: 15px; }
.sync-btn { width: 100%; padding: 10px; background: var(--lava); border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
.sync-btn:hover { background: var(--flame); }
.sync-btn:disabled { background: var(--ash); cursor: not-allowed; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: var(--rust); }
::-webkit-scrollbar-thumb:hover { background: var(--lava); }

@media (max-width: 768px) {
  .topbar-inner { padding: 0 20px; }
  .navlinks { display: none; }
  .hero { padding: 32px; }
  .grid { padding: 0 20px; }
  .sec-head { padding: 0 20px; }
  .catbar { padding: 0 20px; }
  .hero-dots { left: 32px; bottom: 20px; }
  .hero-arrow { display: none; }
  .hero-title { font-size: 38px; }
  .portal-head { padding: 8px 16px; }
  .portal-body { padding: 0 16px 24px; gap: 16px; }
  .vframe { border-radius: 8px; }
  .info-row { flex-direction: column; padding: 16px; align-items: center; }
  .info-poster { width: 130px; height: 195px; }
  .info-details { width: 100%; }
}
</style>
</head>
<body>

<div id="loginPortal" class="login-portal">
  <div class="login-box">
    <h1>Z-Stream Access</h1>
    <div id="loginStatus" class="login-status"></div>
    <input type="text" id="loginUser" class="login-input" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPass" class="login-input" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Enter the Abyss</button>
    <div id="loginError" class="login-error">Invalid credentials. Try again.</div>
    <p class="login-hint">First run? Default login is <b>admin / admin</b><br>(or the ADMIN_USER / ADMIN_PASS env vars).</p>
  </div>
</div>

<div class="atmosphere"></div>
<div class="grain"></div>
<div class="vignette"></div>

<nav class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="switchView('home')"><div class="brand-name">Z-Stream</div></div>
    <div class="navlinks">
      <button class="navlink active" data-view="home" onclick="switchView('home')">Home</button>
      <button class="navlink" data-view="films" onclick="switchView('films')">Films</button>
      <button class="navlink" data-view="series" onclick="switchView('series')">Series</button>
      <button class="navlink" data-view="anime" onclick="switchView('anime')">Anime</button>
      <button class="navlink" data-view="favorites" onclick="switchView('favorites')">Favorites <span class="badge" id="favCount">0</span></button>
      <button class="navlink" data-view="history" onclick="switchView('history')">History <span class="badge" id="histCount">0</span></button>
    </div>
    <div class="header-right">
      <div class="searchbox">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search the abyss..." autocomplete="off" oninput="handleSearch()">
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="stage" id="stage">
  <div class="hero" id="hero">
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <div class="hero-arrow left" onclick="prevHero()">‹</div>
    <div class="hero-arrow right" onclick="nextHero()">›</div>
    <div class="hero-body">
      <div class="hero-chip">Featured</div>
      <h1 class="hero-title" id="heroTitle"></h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-acts" id="heroActs"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
  <div class="catbar" id="catbar"><div class="catpill active" data-cat="all">All</div></div>
  <div id="sections"></div>
  <div class="empty" id="empty"><h3 id="emptyTitle">Empty</h3><p id="emptyDesc">Nothing exists here yet.</p></div>
</main>

<!-- ── Player ── -->
<div class="portal" id="portal">
  <div class="portal-head">
    <div class="portal-title" id="portalTitle">Now Playing</div>
    <button class="portal-x" onclick="closePlayer()" title="Close (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="portal-body" id="portalBody">
    <div class="vframe" id="vframe">
      <div class="vplaceholder" id="vplaceholder"><p>Select a server below to start watching.</p></div>
    </div>

    <div>
      <div class="sub-head" style="margin-bottom:14px;">Servers</div>
      <div class="server-grid" id="nodelist"></div>
    </div>

    <div class="info-row">
      <img id="infoPoster" class="info-poster" src="" alt="">
      <div class="info-details">
        <div class="info-header">
          <h2 class="info-title" id="infoTitle"></h2>
          <button class="heart-btn" id="playerFavBtn" onclick="togglePlayerFav()" title="Toggle favorite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          </button>
        </div>
        <div class="info-meta" id="infoMeta"></div>
        <p class="info-desc" id="infoDesc"></p>
      </div>
    </div>

    <div class="episodes-section" id="episodesSection" style="display:none;">
      <div class="sub-head">Episodes</div>
      <div class="seasons-bar" id="seasonsBar"></div>
      <div class="episodes-grid" id="episodesGrid"></div>
    </div>
  </div>
</div>

<div class="sync-panel" id="syncPanel">
  <h4>Database Sync</h4>
  <p id="syncStatusText">Status: Idle</p>
  <button class="sync-btn" id="syncBtn" onclick="startSync()">Start Caching TMDB</button>
</div>

<script>
const API_BASE = '/api';

/* ─────────── Helpers ─────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtRating = r => Number(r || 0).toFixed(1);
const PLACEHOLDER = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 450'%3E%3Crect width='300' height='450' fill='%23140000'/%3E%3Ctext x='150' y='230' fill='%23662222' font-family='sans-serif' font-size='18' text-anchor='middle'%3ENo Poster%3C/text%3E%3C/svg%3E";
function imgFallback(img) { img.onerror = null; img.src = PLACEHOLDER; }

/* ─────────── Auth ─────────── */
function checkAuth() {
  if (localStorage.getItem('zs_auth') !== 'true') {
    $('loginPortal').style.display = 'flex';
    probeHealth();
  } else {
    $('loginPortal').style.display = 'none';
    init();
    checkSyncStatus();
    $('syncPanel').style.display = 'block';
  }
}

async function probeHealth() {
  try {
    const r = await fetch(`${API_BASE}/health`);
    const h = await r.json();
    if (!h.db) {
      $('loginStatus').innerHTML = `⚠️ ${esc(h.dbError || 'Database unreachable')} — <a href="/api/health" target="_blank">full diagnostics</a>`;
      $('loginStatus').style.display = 'block';
    } else if (h.tables && h.tables.users === 'MISSING') {
      $('loginStatus').textContent = 'Note: no users table yet — admin/admin will be created on first login attempt.';
      $('loginStatus').style.display = 'block';
    }
  } catch (e) { /* server down — login attempt will report it */ }
}

async function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  const err = $('loginError'), btn = $('loginBtn');
  err.style.display = 'none';
  if (!u || !p) { err.textContent = 'Enter both username and password.'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Connecting…';
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 60000); // Render free-tier cold start can take ~50s

  try {
    const r = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
      signal: ctrl.signal
    });
    clearTimeout(to);
    const data = await r.json().catch(() => ({}));

    if (r.ok && data.success) {
      localStorage.setItem('zs_auth', 'true');
      location.reload();
      return;
    }
    if (data.error === 'db_down') {
      err.innerHTML = `Database problem: ${esc(data.message)}<br><a href="/api/health" target="_blank">Run /api/health for details</a>`;
    } else if (data.error === 'rate_limited') {
      err.textContent = data.message || 'Too many attempts. Wait a few minutes.';
    } else if (data.error === 'bad_request') {
      err.textContent = data.message;
    } else {
      err.textContent = data.message || 'Invalid username or password. Default is admin/admin.';
    }
    err.style.display = 'block';
  } catch (e) {
    clearTimeout(to);
    if (e.name === 'AbortError') {
      err.textContent = 'The server took too long to respond. If you are on Render\u2019s free tier, the service may be waking up — wait a minute and try again.';
    } else {
      err.textContent = 'Cannot reach the server — check Render logs / is the service deployed and running?';
    }
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enter the Abyss';
  }
}

function doLogout() { localStorage.removeItem('zs_auth'); location.reload(); }
 $('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
 $('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* ─────────── Local cache (favorites / history) ─────────── */
const Cache = {
  get(k) { try { return JSON.parse(localStorage.getItem('hs_' + k)) || []; } catch { return []; } },
  set(k, v) { localStorage.setItem('hs_' + k, JSON.stringify(v)); },
  add(k, item) {
    const d = this.get(k);
    if (!d.find(x => x.id === item.id && x.season === item.season && x.episode === item.episode)) {
      d.unshift(item);
      if (k === 'hist' && d.length > 60) d.length = 60;
      this.set(k, d);
    }
    this.updateCounts();
  },
  remove(k, id) { this.set(k, this.get(k).filter(x => x.id !== id)); this.updateCounts(); },
  has(k, id) { return this.get(k).some(x => x.id === id); },
  updateCounts() { $('favCount').textContent = this.get('fav').length; $('histCount').textContent = this.get('hist').length; }
};
Cache.updateCounts();

/* ─────────── State ─────────── */
let view = 'home', cat = 'all', allMovies = [], allCats = [];
let currentMovie = null, dynamicSources = [], currentSeasons = [];
let activeSeason = 1, activeEpisode = 1, preferredSource = null;
let heroItems = [], heroIndex = 0, heroInterval = null;

/* ─────────── Views ─────────── */
function switchView(v) {
  view = v;
  clearInterval(heroInterval);
  document.querySelectorAll('.navlink').forEach(l => l.classList.remove('active'));
  document.querySelector(`.navlink[data-view="${v}"]`)?.classList.add('active');
  $('hero').classList.remove('visible');
  $('catbar').style.display = 'none';
  $('sections').innerHTML = '';
  $('empty').style.display = 'none';
  window.scrollTo(0, 0);
  $('stage').classList.toggle('pad-top', v !== 'home');

  if (v === 'home') {
    $('catbar').style.display = 'flex';
    renderSections(allMovies);
    if (allMovies.length > 0) initHero(allMovies);
    else showEmpty('Database Empty', 'Start a TMDB sync from the panel in the bottom-right corner, or check /api/health.');
  } else if (v === 'favorites') {
    const f = Cache.get('fav');
    if (f.length === 0) showEmpty('Favorites Empty', 'Tap the heart on any card to save it here.');
    else renderSection('Favorites', f);
  } else if (v === 'history') {
    const h = Cache.get('hist');
    if (h.length === 0) showEmpty('History Empty', 'Titles you watch will appear here.');
    else renderSection('Recently Watched', h);
  } else {
    const f = allMovies.filter(m => m.type === v);
    if (f.length === 0) showEmpty('No Content', `No ${v} cached yet. Run a sync first.`);
    else renderSection(v === 'films' ? 'Films' : v === 'series' ? 'Series' : 'Anime', f);
  }
}
function showEmpty(t, d) { $('emptyTitle').textContent = t; $('emptyDesc').textContent = d; $('empty').style.display = 'flex'; }

/* ─────────── Live search ─────────── */
let searchTimer = null, searchToken = 0;
function handleSearch() {
  clearTimeout(searchTimer);
  const q = $('searchInput').value.trim();
  const dd = $('searchDropdown');
  if (q.length < 2) { dd.style.display = 'none'; dd.innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
}
async function doSearch(q) {
  const token = ++searchToken;
  const dd = $('searchDropdown');
  dd.innerHTML = '<div class="search-item"><div class="search-item-info"><div class="search-item-title">Searching…</div></div></div>';
  dd.style.display = 'block';
  try {
    const r = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
    if (token !== searchToken) return;
    const res = await r.json();
    if (!Array.isArray(res) || res.length === 0) {
      dd.innerHTML = '<div class="search-item"><div class="search-item-info"><div class="search-item-title">No results found</div><div class="search-item-meta">Try a different title.</div></div></div>';
      return;
    }
    dd.innerHTML = res.map(m => {
      const label = m.type === 'films' ? 'Film' : m.type === 'anime' ? 'Anime' : 'Series';
      return `<div class="search-item" data-id="${m.id}">
        <img src="${esc(m.poster) || PLACEHOLDER}" alt="" onerror="imgFallback(this)">
        <div class="search-item-info">
          <div class="search-item-title">${esc(m.title)}</div>
          <div class="search-item-meta"><span class="type-tag">${label}</span>${esc(m.release_date || '')} &nbsp;•&nbsp; ⭐ ${fmtRating(m.rating)}</div>
        </div>
      </div>`;
    }).join('');
    dd.querySelectorAll('.search-item[data-id]').forEach(el => {
      el.addEventListener('click', () => {
        openPlayer(parseInt(el.dataset.id));
        $('searchInput').value = '';
        dd.style.display = 'none';
      });
    });
  } catch (e) {
    if (token !== searchToken) return;
    dd.innerHTML = '<div class="search-item"><div class="search-item-info"><div class="search-item-title">Search failed. Try again.</div></div></div>';
  }
}
 $('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = document.querySelector('#searchDropdown .search-item[data-id]');
    if (first) first.click();
  } else if (e.key === 'Escape') {
    $('searchDropdown').style.display = 'none';
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchbox')) $('searchDropdown').style.display = 'none';
});

/* ─────────── API wrappers ─────────── */
async function fetchMovies() { try { const r = await fetch(`${API_BASE}/movies`); return r.ok ? await r.json() : []; } catch { return []; } }
async function fetchCats() { try { const r = await fetch(`${API_BASE}/categories`); return r.ok ? await r.json() : [{ id: 'all', name: 'All' }]; } catch { return [{ id: 'all', name: 'All' }]; } }
async function fetchSources(id, s, e, type) {
  try {
    const r = await fetch(`${API_BASE}/sources?id=${id}&s=${s}&e=${e}&type=${encodeURIComponent(type || '')}`);
    if (!r.ok) return [];
    const data = await r.json();
    return Array.isArray(data) ? data.filter(x => x && x.name && x.url) : [];
  } catch { return []; }
}
async function fetchSeasons(id) { try { const r = await fetch(`${API_BASE}/seasons/${id}`); return r.ok ? await r.json() : []; } catch { return []; } }

/* ─────────── Hero ─────────── */
function initHero(items) {
  const withBackdrop = items.filter(m => m.backdrop);
  heroItems = (withBackdrop.length >= 3 ? withBackdrop : items)
    .slice()
    .sort((a, b) => (b.rating || 0) - (a.rating || 0))
    .slice(0, 8);
  if (!heroItems.length) return;
  $('heroDots').innerHTML = heroItems.map((_, i) => `<div class="hero-dot ${i === 0 ? 'active' : ''}" data-i="${i}"></div>`).join('');
  $('heroDots').querySelectorAll('.hero-dot').forEach(d => d.addEventListener('click', () => changeHero(parseInt(d.dataset.i))));
  changeHero(0);
  startHeroAuto();
}
function changeHero(index) {
  heroIndex = index;
  renderHero(heroItems[index]);
  document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === index));
}
function nextHero() { changeHero((heroIndex + 1) % heroItems.length); }
function prevHero() { changeHero((heroIndex - 1 + heroItems.length) % heroItems.length); }
function startHeroAuto() { clearInterval(heroInterval); heroInterval = setInterval(nextHero, 8000); }
function renderHero(m) {
  if (!m) return;
  $('heroBackdrop').style.backgroundImage = `url("${m.backdrop || m.poster || ''}")`;
  $('heroTitle').textContent = (m.title || '').toUpperCase();
  $('heroMeta').innerHTML = `<span class="star">⭐ ${fmtRating(m.rating)}</span><span class="dot"></span><span>${esc(m.release_date || '')}</span><span class="dot"></span><span>${esc(m.genre || '')}</span>`;
  $('heroDesc').textContent = m.overview || '';
  const fav = Cache.has('fav', m.id);
  $('heroActs').innerHTML = `<button class="btn btn-lava" onclick="openPlayer(${m.id})">▶ Watch Now</button><button class="btn btn-ghost" onclick="toggleFav(${m.id})">${fav ? '♥ In Favorites' : '♡ Add to Favorites'}</button>`;
  $('hero').classList.add('visible');
}

/* ─────────── Rendering (20 per category, 5×2 grid) ─────────── */
function renderCats(cats) {
  const bar = $('catbar');
  bar.innerHTML = cats.map(c => `<div class="catpill ${c.id === 'all' ? 'active' : ''}" data-cat="${esc(c.id)}">${esc(c.name)}</div>`).join('');
  bar.querySelectorAll('.catpill').forEach(p => p.addEventListener('click', () => filterCategory(p.dataset.cat, p)));
}
function skel(c = 10) { return Array.from({ length: c }, () => '<div class="skel-card"><div class="skel-img"></div><div class="skel-line"></div><div class="skel-line s"></div></div>').join(''); }
function card(m) {
  const fav = Cache.has('fav', m.id);
  const s = Number(m.season) || 1, e = Number(m.episode) || 1;
  return `<div class="card">
    <div class="card-media" onclick="openPlayer(${m.id}, ${s}, ${e})">
      <img src="${esc(m.poster) || PLACEHOLDER}" class="card-img" alt="${esc(m.title)}" loading="lazy" onerror="imgFallback(this)">
      <div class="card-badges"><div class="badge-rate">${fmtRating(m.rating)}</div></div>
      <div class="card-overlay"><div class="playbtn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>
    </div>
    <button class="card-fav ${fav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${m.id})" title="Toggle favorite">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="${fav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </button>
    <div class="card-info">
      <div class="card-title">${esc(m.title)}</div>
      <div class="card-meta"><span>${esc(m.release_date || '—')}</span><span class="sep"></span><span>${esc(m.genre || '')}</span></div>
    </div>
  </div>`;
}
function renderSection(title, movies, sid = '') {
  const id = sid || 's_' + Math.random().toString(36).slice(2, 11);
  const head = title ? `<div class="sec-head"><h2 class="sec-title">${esc(title)}</h2></div>` : '';
  const items = movies.length > 0 ? movies.map(card).join('') : skel(10);
  $('sections').insertAdjacentHTML('beforeend', `${head}<div class="grid" id="${id}">${items}</div>`);
}
function renderSections(movies) {
  $('sections').innerHTML = '';
  if (cat !== 'all') {
    const f = movies.filter(m => m.genre === cat).slice(0, 20);
    if (f.length === 0) { showEmpty('Nothing Here', `No titles in "${cat}" yet.`); return; }
    renderSection(cat, f);
    return;
  }
  const gmap = {};
  movies.forEach(m => { const g = m.genre || 'Other'; (gmap[g] = gmap[g] || []).push(m); });
  Object.entries(gmap).forEach(([g, items]) => renderSection(g, items.slice(0, 20)));
}
function filterCategory(cid, el) {
  cat = cid;
  document.querySelectorAll('.catpill').forEach(p => p.classList.remove('active'));
  if (el) el.classList.add('active');
  else document.querySelector(`.catpill[data-cat="${CSS.escape(cid)}"]`)?.classList.add('active');
  if (view === 'home') renderSections(allMovies);
}
function toggleFav(id) {
  const m = allMovies.find(x => x.id === id) || currentMovie;
  if (!m) return;
  if (Cache.has('fav', id)) Cache.remove('fav', id); else Cache.add('fav', m);
  if (view === 'favorites') switchView('favorites');
  else if (view === 'home') {
    if (heroItems[heroIndex] && heroItems[heroIndex].id === id) renderHero(heroItems[heroIndex]);
    renderSections(allMovies);
  }
  if (currentMovie && currentMovie.id === id) updatePlayerFavBtn();
}

/* ─────────── Player ─────────── */
async function openPlayer(id, season = 1, episode = 1) {
  activeSeason = Math.max(1, parseInt(season) || 1);
  activeEpisode = Math.max(1, parseInt(episode) || 1);

  const local = allMovies.find(m => m.id === id);
  currentMovie = local || { id, title: 'Loading…', poster: '', release_date: '', rating: 0, genre: '', overview: '', type: '' };

  $('portal').classList.add('on');
  document.body.style.overflow = 'hidden';
  $('portalBody').scrollTop = 0;

  try {
    const r = await fetch(`${API_BASE}/movie/${id}`);
    if (r.ok) currentMovie = await r.json();
  } catch (e) { /* keep local copy */ }

  renderPlayerInfo();
  await loadSources();

  const isTV = currentMovie && (currentMovie.type === 'series' || currentMovie.type === 'anime');
  if (isTV) {
    $('episodesSection').style.display = 'flex';
    currentSeasons = await fetchSeasons(currentMovie.id);
    renderSeasons();
  } else {
    $('episodesSection').style.display = 'none';
    currentSeasons = [];
  }
}

function renderPlayerInfo() {
  const m = currentMovie || {};
  $('infoTitle').textContent = m.title || 'Unknown Title';
  $('portalTitle').textContent = m.title || 'Now Playing';
  const poster = $('infoPoster');
  poster.src = m.poster || PLACEHOLDER;
  poster.onerror = function () { imgFallback(this); };
  $('infoMeta').innerHTML = `<span class="star">⭐ ${fmtRating(m.rating)}</span><span>•</span><span>${esc(m.release_date || 'N/A')}</span><span>•</span><span>${esc(m.genre || 'N/A')}</span><span>•</span><span>TMDb ${m.id || '—'}</span>`;
  $('infoDesc').textContent = m.overview || 'No description available.';
  updatePlayerFavBtn();
}

async function loadSources() {
  const id = currentMovie?.id;
  if (!id) return;
  const node = $('nodelist');
  node.innerHTML = `<p class="src-note">Loading servers for S${activeSeason}E${activeEpisode}…</p>`;
  showVideoLoading(`Loading servers for S${activeSeason}E${activeEpisode}…`);

  dynamicSources = await fetchSources(id, activeSeason, activeEpisode, currentMovie?.type);

  if (!dynamicSources.length) {
    node.innerHTML = '<p class="src-note">No sources available for this title.</p>';
    showVideoPlaceholder('No sources available. Try another title.');
    return;
  }

  // Bind via data-name + addEventListener → no inline-escaping bugs
  node.innerHTML = dynamicSources.map(s => `<div class="server-btn" data-name="${esc(s.name)}">${esc(s.name)}</div>`).join('');
  const btns = node.querySelectorAll('.server-btn');
  btns.forEach(btn => btn.addEventListener('click', () => selSrc(btn, btn.dataset.name)));

  // Restore preferred server across episode changes, else first server
  const idx = Math.max(0, dynamicSources.findIndex(s => s.name === preferredSource));
  if (btns[idx]) selSrc(btns[idx], dynamicSources[idx].name);

  if (currentMovie) Cache.add('hist', { ...currentMovie, season: activeSeason, episode: activeEpisode });
}

function selSrc(btn, name) {
  if (!btn) return;
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  preferredSource = name;

  const source = dynamicSources.find(s => s.name === name);
  if (!source || !source.url) { showVideoPlaceholder('This source is unavailable.'); return; }

  const vframe = $('vframe');
  const old = $('uvideo');
  if (old) old.remove();

  const iframe = document.createElement('iframe');
  iframe.id = 'uvideo';

  // ── FIX 1: referrerpolicy ──
  // 'no-referrer' breaks providers that validate the referrer, and the old
  // setting produced console spam + fallback popup behavior on some sources.
  // 'strict-origin-when-cross-origin' sends just our origin — accepted by
  // virtually every embed provider.
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');

  // ── FIX 2: sandbox blocks popup ads (e.g. intellipopup.com) ──
  // We deliberately do NOT include 'allow-popups' or 'allow-top-navigation',
  // so the embedded player cannot open popup ads or redirect this page.
  // If a specific provider refuses to play, test by temporarily removing
  // the sandbox attribute for that source.
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');

  iframe.setAttribute('allowfullscreen', 'true');
  iframe.setAttribute('allow', 'fullscreen; autoplay; encrypted-media; picture-in-picture');
  iframe.setAttribute('frameborder', '0');
  iframe.setAttribute('scrolling', 'no');
  iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;background:#000;';
  iframe.addEventListener('load', hideVideoLoading);

  showVideoLoading(`Connecting to ${name}…`);
  vframe.appendChild(iframe);

  // Small delay so the iframe is attached before navigation starts
  setTimeout(() => { iframe.src = source.url; }, 50);
}

let videoLoadTimer = null;
function showVideoLoading(msg) {
  const ph = $('vplaceholder');
  ph.style.display = 'flex';
  ph.innerHTML = `<div class="spinner"></div><p>${esc(msg || 'Loading…')}</p>`;
  clearTimeout(videoLoadTimer);
  videoLoadTimer = setTimeout(() => {
    if (ph.style.display !== 'none') {
      ph.innerHTML = '<p>Still loading… if nothing plays, this server may be down — try another server below.</p>';
    }
  }, 12000);
}
function hideVideoLoading() {
  clearTimeout(videoLoadTimer);
  $('vplaceholder').style.display = 'none';
}
function showVideoPlaceholder(msg) {
  clearTimeout(videoLoadTimer);
  const ph = $('vplaceholder');
  ph.style.display = 'flex';
  ph.innerHTML = `<p>${esc(msg)}</p>`;
}

function renderSeasons() {
  const bar = $('seasonsBar');
  const grid = $('episodesGrid');
  bar.innerHTML = currentSeasons.map(s =>
    `<div class="season-pill ${s.season_number === activeSeason ? 'active' : ''}" onclick="selectSeason(${s.season_number})">${esc(s.name)}</div>`
  ).join('');

  const currentS = currentSeasons.find(s => s.season_number === activeSeason);
  const epCount = currentS?.episode_count || 0;
  grid.innerHTML = Array.from({ length: epCount }, (_, i) => i + 1).map(ep =>
    `<div class="ep-btn ${ep === activeEpisode ? 'active' : ''}" onclick="selectEpisode(${activeSeason}, ${ep})">${ep}</div>`
  ).join('') || '<p class="src-note">No episode data for this season.</p>';
}

function selectSeason(s) {
  activeSeason = s;
  activeEpisode = 1;
  renderSeasons();
  loadSources(); // refresh sources for new season without rebuilding the whole player
}

function selectEpisode(s, e) {
  activeSeason = s;
  activeEpisode = e;
  renderSeasons();
  loadSources();
}

function updatePlayerFavBtn() {
  const btn = $('playerFavBtn');
  const isFav = currentMovie && Cache.has('fav', currentMovie.id);
  btn.classList.toggle('active', !!isFav);
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
}
function togglePlayerFav() { if (currentMovie) toggleFav(currentMovie.id); }

function closePlayer() {
  $('portal').classList.remove('on');
  document.body.style.overflow = '';
  const old = $('uvideo');
  if (old) old.remove();
  showVideoPlaceholder('Select a server below to start watching.');
  currentMovie = null;
  dynamicSources = [];
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('portal').classList.contains('on')) closePlayer();
});

/* ─────────── Sync engine UI ─────────── */
async function startSync() {
  $('syncBtn').disabled = true;
  $('syncBtn').innerText = 'Starting…';
  try { await fetch(`${API_BASE}/start-sync`); } catch (e) {}
  checkSyncStatus();
}
let syncInterval = null;
async function checkSyncStatus() {
  clearInterval(syncInterval);
  syncInterval = setInterval(async () => {
    try {
      const r = await fetch(`${API_BASE}/sync-status`);
      const data = await r.json();
      const btn = $('syncBtn');
      const txt = $('syncStatusText');
      if (data.isSyncing) {
        txt.innerHTML = `Status: Syncing <b>${esc(data.category)}</b><br>Page: ${data.currentPage}<br>Cached Items: ${data.totalItems}`;
        btn.disabled = true; btn.innerText = 'Syncing…';
      } else {
        txt.innerHTML = `Status: Idle / Complete<br>Cached Items: ${data.totalItems}`;
        btn.disabled = false; btn.innerText = 'Start Caching TMDB';
      }
    } catch (e) {}
  }, 2000);
}

/* ─────────── Init ─────────── */
async function init() {
  $('sections').innerHTML = `<div class="sec-head"><h2 class="sec-title">Loading Database…</h2></div><div class="grid">${skel(10)}</div>`;
  const [movies, cats] = await Promise.all([fetchMovies(), fetchCats()]);
  allMovies = Array.isArray(movies) ? movies : [];
  allCats = Array.isArray(cats) ? cats : [{ id: 'all', name: 'All' }];
  renderCats(allCats);
  switchView('home');
}

checkAuth();
</script>
