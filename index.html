<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Stream - Infernal Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #000000; --abyss: #050000; --crust: #0A0000; --regolith: #100000;
  --rust-deep: #5a0a0e; --rust: #8a0c12; --copper: #B00710; --magma: #C40612;
  --lava: #E50914; --ember: #FF1A1A; --flame: #FF3333; --solar: #FF4D4D;
  --aurora: #FF6666; --gold: #FBBF24; --honey: #FFD700; --cream: #FFFFFF;
  --starlight: #FFFFFF; --fog: #E5E5E5; --ash: #A1A1A1; --dust: #717171;
  --danger: #FF0000; --success: #10b981;
  --bg: var(--void); --bg-elevated: rgba(20, 0, 0, 0.5); --bg-glass: rgba(229, 9, 20, 0.05);
  --accent: var(--lava); --text: var(--starlight); --text-dim: var(--fog);
  --border: rgba(229, 9, 20, 0.2); --border-hover: rgba(229, 9, 20, 0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: #000000; color: var(--text); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

.atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.atmosphere::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 15% 50%, rgba(229,9,20,0.15) 0%, transparent 55%), radial-gradient(ellipse 60% 50% at 85% 20%, rgba(255,26,26,0.08) 0%, transparent 50%); }
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 9998; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(0,0,0,0.9) 100%); }

.login-portal { position: fixed; inset: 0; z-index: 5000; background: #000000; backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; }
.login-box { background: rgba(10, 0, 0, 0.8); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 80px rgba(229,9,20,0.15); }
.login-box h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; letter-spacing: 4px; color: #FFFFFF; text-align: center; margin-bottom: 30px; text-transform: uppercase; text-shadow: 0 0 20px rgba(229,9,20,0.5); }
.login-input { width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; transition: all 0.3s ease; }
.login-input:focus { border-color: var(--lava); box-shadow: 0 0 0 3px rgba(229,9,20,0.2); }
.login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--magma), var(--lava)); border: none; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(229,9,20,0.5); }
.login-error { color: var(--danger); text-align: center; margin-top: 16px; font-size: 13px; display: none; }

.topbar { position: sticky; top: 0; z-index: 200; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(30px) saturate(180%); border-bottom: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 48px; width: 100%; padding: 0 40px; position: relative; }
.brand { display: flex; align-items: center; cursor: pointer; z-index: 2; }
.brand-name { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 4px; color: #FFFFFF; text-transform: uppercase; text-shadow: 0 0 40px rgba(229,9,20,0.5); }

.navlinks { display: flex; align-items: center; gap: 2px; position: absolute; left: 50%; transform: translateX(-50%); background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); padding: 4px; border-radius: 30px; backdrop-filter: blur(10px); z-index: 1; }
.navlink { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: all 0.3s; color: var(--text-dim); font-size: 13px; font-weight: 500; border: none; background: transparent; }
.navlink::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%) scaleX(0); width: 16px; height: 2px; background: var(--lava); border-radius: 2px; transition: transform 0.3s ease; }
.navlink:hover { color: var(--text); background: rgba(229,9,20,0.1); }
.navlink:hover::after { transform: translateX(-50%) scaleX(1); }
.navlink.active { color: #fff; background: linear-gradient(135deg, rgba(229,9,20,0.3), rgba(255,26,26,0.15)); }
.navlink.active::after { transform: translateX(-50%) scaleX(1); width: 20px; background: var(--flame); }
.navlink .badge { font-family: 'Space Grotesk', monospace; font-size: 9px; padding: 1px 6px; background: rgba(229,9,20,0.3); border-radius: 4px; color: var(--solar); min-width: 18px; text-align: center; }

.header-right { display: flex; align-items: center; gap: 12px; z-index: 2; position: relative; }
.searchbox { position: relative; width: 260px; flex-shrink: 0; }
.searchbox input { width: 100%; padding: 8px 14px 8px 36px; background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 12px; outline: none; transition: all 0.35s ease; backdrop-filter: blur(10px); }
.searchbox input:focus { border-color: var(--lava); box-shadow: 0 0 0 3px rgba(229,9,20,0.2); background: rgba(0, 0, 0, 0.8); }
.searchbox .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ash); pointer-events: none; }

.search-dropdown { position: absolute; top: 100%; right: 0; width: 100%; margin-top: 8px; background: rgba(10, 0, 0, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); max-height: 400px; overflow-y: auto; z-index: 100; padding: 8px; display: none; }
.search-item { display: flex; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
.search-item:hover { background: rgba(229, 9, 20, 0.1); }
.search-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 6px; background: #111; }
.search-item-info { display: flex; flex-direction: column; justify-content: center; }
.search-item-title { color: var(--text); font-size: 14px; font-weight: 600; }
.search-item-meta { color: var(--ash); font-size: 12px; }

.logout-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(20, 0, 0, 0.4); border: 1px solid var(--border); color: var(--ash); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
.logout-btn:hover { background: rgba(229,9,20,0.2); color: var(--flame); border-color: var(--lava); }

.stage { position: relative; z-index: 2; width: 100%; padding: 0 0 80px 0; margin-top: -48px; transition: padding-top 0.3s ease; }
.stage.pad-top { padding-top: 100px; } 

.hero { position: relative; width: 100vw; height: 100vh; min-height: 600px; overflow: hidden; display: none; align-items: flex-end; padding: 80px; background: #000000; isolation: isolate; }
.hero.visible { display: flex; animation: heroReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes heroReveal { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 25% 70%, rgba(229,9,20,0.2) 0%, transparent 55%); z-index: 1; }
.hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(0deg, #000000 0%, rgba(0,0,0,0.6) 40%, transparent 100%); z-index: 2; }
.hero-backdrop { position: absolute; inset: 0; z-index: 0; opacity: 0.6; background-size: cover; background-position: center 20%; filter: saturate(0.8) contrast(1.15) brightness(0.8); mask-image: linear-gradient(0deg, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(0deg, black 20%, transparent 100%); }
.hero-body { position: relative; z-index: 3; max-width: 680px; padding-bottom: 60px; }
.hero-chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; background: rgba(229,9,20,0.15); border: 1px solid var(--border); border-radius: 24px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: var(--flame); margin-bottom: 24px; backdrop-filter: blur(10px); }
.hero-chip::before { content: ''; width: 6px; height: 6px; background: var(--lava); border-radius: 50%; box-shadow: 0 0 10px var(--lava); animation: pulseGlow 2s infinite; }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px var(--lava); } 50% { box-shadow: 0 0 20px var(--lava), 0 0 30px rgba(229,9,20,0.5); } }
.hero-title { font-family: 'Orbitron', sans-serif; font-size: 64px; font-weight: 900; line-height: 1.05; margin-bottom: 18px; background: linear-gradient(135deg, #fff 0%, #fff 40%, var(--lava) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; }
.hero-meta { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; font-size: 13.5px; color: var(--fog); flex-wrap: wrap; }
.hero-meta .star { display: flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; }
.hero-meta .dot { width: 4px; height: 4px; background: var(--lava); border-radius: 50%; }
.hero-desc { font-size: 15.5px; line-height: 1.8; color: var(--text-dim); margin-bottom: 36px; max-width: 540px; font-weight: 300; }
.hero-acts { display: flex; gap: 16px; flex-wrap: wrap; }

.hero-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 48px; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 4; user-select: none; transition: color 0.2s; padding: 0 20px; font-weight: 300; }
.hero-arrow:hover { color: var(--lava); }
.hero-arrow.left { left: 0; }
.hero-arrow.right { right: 0; }
.hero-dots { position: absolute; bottom: 40px; left: 80px; display: flex; gap: 8px; z-index: 4; }
.hero-dot { width: 32px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; transition: all 0.3s; }
.hero-dot:hover { background: rgba(255,255,255,0.4); }
.hero-dot.active { background: var(--lava); box-shadow: 0 0 12px var(--lava); width: 48px; }

.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); border: none; outline: none; position: relative; overflow: hidden; }
.btn-lava { background: linear-gradient(135deg, var(--magma), var(--lava), var(--flame)); color: #fff; box-shadow: 0 4px 24px rgba(229,9,20,0.5); }
.btn-lava:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(229,9,20,0.6); }
.btn-ghost { background: rgba(20, 0, 0, 0.5); color: var(--text); border: 1px solid var(--border); backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(229,9,20,0.15); border-color: var(--border-hover); transform: translateY(-2px); }

.catbar { display: flex; gap: 10px; margin: 40px 0 36px 0; flex-wrap: wrap; width: 100%; padding: 0 40px; }
.catpill { padding: 10px 22px; border-radius: 12px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); color: var(--text-dim); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
.catpill:hover { background: rgba(229,9,20,0.15); color: var(--text); transform: translateY(-1px); }
.catpill.active { background: linear-gradient(135deg, rgba(229,9,20,0.25), rgba(255,26,26,0.15)); border-color: var(--lava); color: #fff; }

.sec-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; width: 100%; padding: 0 40px; }
.sec-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
.sec-title::before { content: ''; width: 5px; height: 24px; background: var(--lava); border-radius: 3px; box-shadow: 0 0 16px var(--lava); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px; margin-bottom: 64px; width: 100%; padding: 0 40px; }

.card { position: relative; border-radius: 20px; overflow: hidden; cursor: pointer; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border); background: rgba(10, 0, 0, 0.5); }
.card:hover { transform: translateY(-12px) scale(1.02); border-color: var(--lava); box-shadow: 0 28px 56px rgba(0,0,0,0.8), 0 0 0 1px rgba(229,9,20,0.2), 0 0 80px rgba(229,9,20,0.15); }
.card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; transition: transform 0.6s; }
.card:hover .card-img { transform: scale(1.08); }
.card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.95) 100%); opacity: 0; transition: opacity 0.4s; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; z-index: 2; }
.card:hover .card-overlay { opacity: 1; }
.playbtn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--magma), var(--lava)); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; box-shadow: 0 6px 24px rgba(229,9,20,0.6); transition: all 0.35s; }
.card:hover .playbtn { transform: scale(1.12); }
.playbtn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }
.card-badges { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: flex-start; z-index: 3; pointer-events: none; }
.badge-rate { display: flex; align-items: center; gap: 5px; padding: 6px 11px; background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); border-radius: 10px; font-size: 11.5px; font-weight: 700; color: var(--gold); }
.badge-rate::before { content: ''; width: 7px; height: 7px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 8px var(--gold); }
.card-info { padding: 16px; }
.card-title { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 11.5px; color: var(--ash); display: flex; align-items: center; gap: 10px; }
.card-meta .sep { width: 3px; height: 3px; background: var(--lava); border-radius: 50%; }
.card-fav { position: absolute; top: 14px; right: 14px; z-index: 5; width: 32px; height: 32px; border-radius: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s; opacity: 0; transform: scale(0.8); }
.card:hover .card-fav { opacity: 1; transform: scale(1); }
.card-fav:hover { background: rgba(229,9,20,0.4); border-color: var(--lava); }

.skel-card { border-radius: 20px; overflow: hidden; background: rgba(10, 0, 0, 0.5); border: 1px solid var(--border); }
.skel-img { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, #100000 25%, rgba(229,9,20,0.1) 50%, #100000 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; }
.skel-line { height: 14px; margin: 14px 16px; border-radius: 7px; background: linear-gradient(90deg, #100000 25%, rgba(229,9,20,0.1) 50%, #100000 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; }
.skel-line.s { width: 55%; height: 10px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.empty { text-align: center; padding: 100px 20px; color: var(--ash); min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.empty h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--fog); margin-bottom: 12px; }
.empty p { font-size: 15px; max-width: 400px; color: var(--dust); }

.portal { display: none; position: fixed; inset: 0; background: #000000; z-index: 1000; overflow-y: auto; }
.portal.on { display: flex; flex-direction: column; }
.portal-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); z-index: 10; }
.portal-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
.portal-x { width: 36px; height: 36px; border-radius: 10px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); color: var(--ash); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.portal-x:hover { background: rgba(229,9,20,0.2); color: var(--flame); }

.portal-body { padding: 40px; max-width: 1400px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
.vframe { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
.vframe video, .vframe iframe { width: 100%; height: 100%; border: none; border-radius: 16px; }
.vplaceholder { text-align: center; color: var(--ash); padding: 48px; }
.vplaceholder h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--fog); margin-bottom: 10px; }

.player-info { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; width: 100%; flex-wrap: wrap; gap: 20px; }
.player-info h2 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--text); }
.player-info h2 span { color: var(--lava); }

.server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-width: 1400px; margin: 0 auto; width: 100%; }
.server-btn { padding: 14px 10px; background: rgba(20, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 12px; color: var(--text-dim); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s; text-transform: capitalize; }
.server-btn:hover { background: rgba(229,9,20,0.15); color: var(--text); transform: translateY(-2px); }
.server-btn.active { background: linear-gradient(135deg, var(--magma), var(--lava)); color: #fff; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }

.sync-panel { position: fixed; bottom: 20px; right: 20px; background: rgba(10, 0, 0, 0.9); border: 1px solid var(--border); backdrop-filter: blur(20px); padding: 20px; border-radius: 16px; z-index: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; min-width: 300px; }
.sync-panel h4 { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--lava); margin-bottom: 10px; text-transform: uppercase; }
.sync-panel p { font-size: 12px; color: var(--fog); margin-bottom: 15px; }
.sync-btn { width: 100%; padding: 10px; background: var(--lava); border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
.sync-btn:hover { background: var(--flame); }
.sync-btn:disabled { background: var(--ash); cursor: not-allowed; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: var(--rust); }
::-webkit-scrollbar-thumb:hover { background: var(--lava); }

@media (max-width: 768px) { .topbar-inner { padding: 0 20px; } .navlinks { display: none; } .hero { padding: 32px; } .grid { padding: 0 20px; } .hero-dots { left: 32px; bottom: 20px; } .hero-arrow { display: none; } }
</style>
</head>
<body>

<div id="loginPortal" class="login-portal">
  <div class="login-box">
    <h1>Z-Stream Access</h1>
    <input type="text" id="loginUser" class="login-input" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPass" class="login-input" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">Enter the Abyss</button>
    <div id="loginError" class="login-error">Invalid credentials. Try again.</div>
  </div>
</div>

<div class="atmosphere"></div>
<div class="grain"></div>
<div class="vignette"></div>

<nav class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="switchView('main')"><div class="brand-name">Z-Stream</div></div>
    <div class="navlinks">
      <button class="navlink active" data-view="main" onclick="switchView('main')">Main</button>
      <button class="navlink" data-view="films" onclick="switchView('films')">Films</button>
      <button class="navlink" data-view="series" onclick="switchView('series')">Series</button>
      <button class="navlink" data-view="anime" onclick="switchView('anime')">Anime</button>
      <button class="navlink" data-view="favorites" onclick="switchView('favorites')">Favorites <span class="badge" id="favCount">0</span></button>
      <button class="navlink" data-view="history" onclick="switchView('history')">History <span class="badge" id="histCount">0</span></button>
    </div>
    <div class="header-right">
      <div class="searchbox">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search the abyss..." autocomplete="off" oninput="handleSearch()">
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="stage" id="stage">
  <div class="hero" id="hero">
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <div class="hero-arrow left" onclick="prevHero()">‹</div>
    <div class="hero-arrow right" onclick="nextHero()">›</div>
    <div class="hero-body">
      <div class="hero-chip">Featured</div>
      <h1 class="hero-title" id="heroTitle"></h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-acts" id="heroActs"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
  <div class="catbar" id="catbar"><div class="catpill active" data-cat="all" onclick="filterCategory('all')">All</div></div>
  <div id="sections"></div>
  <div class="empty" id="empty" style="display:none;"><h3 id="emptyTitle">Empty</h3><p id="emptyDesc">Nothing exists here yet.</p></div>
</main>

<!-- Film Playing Page -->
<div class="portal" id="portal">
  <div class="portal-head">
    <div class="portal-title" id="portalTitle">Now Playing</div>
    <button class="portal-x" onclick="closePlayer()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="portal-body">
    <div class="vframe">
      <div class="vplaceholder" id="vplaceholder"><h3>Select a server below to start watching.</h3></div>
      <!-- Sandbox removed to allow PrimeSrc dropdowns to work perfectly in all browsers -->
      <iframe id="uvideo" referrerpolicy="no-referrer" allowfullscreen frameborder="0" style="display:none; width:100%; height:100%; border:none;"></iframe>
    </div>
    <div class="player-info">
      <div>
        <h2>Now Playing <span id="nowPlayingTitle">Loading...</span></h2>
        <div style="font-size: 12px; color: var(--ash); margin-top: 5px;">TMDB ID: <span id="tmdbIdDisplay" style="color: var(--lava); font-family: 'Space Grotesk', monospace;">N/A</span></div>
      </div>
      <button class="btn btn-ghost" id="playerFavBtn" onclick="togglePlayerFav()">Favorite</button>
    </div>
    <div class="server-grid" id="nodelist"></div>
  </div>
</div>

<div class="sync-panel" id="syncPanel">
  <h4>Database Sync</h4>
  <p id="syncStatusText">Status: Idle</p>
  <button class="sync-btn" id="syncBtn" onclick="startSync()">Start Caching TMDB</button>
</div>

<script>
const API_BASE = '/api';

// --- AUTH ---
function checkAuth() {
  if (localStorage.getItem('zs_auth') !== 'true') document.getElementById('loginPortal').style.display = 'flex';
  else { document.getElementById('loginPortal').style.display = 'none'; init(); checkSyncStatus(); document.getElementById('syncPanel').style.display = 'block'; }
}
async function doLogin() {
  const u = document.getElementById('loginUser').value, p = document.getElementById('loginPass').value;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username: u, password: p}) });
    if ((await r.json()).success) { localStorage.setItem('zs_auth', 'true'); location.reload(); }
    else document.getElementById('loginError').style.display = 'block';
  } catch (e) { document.getElementById('loginError').style.display = 'block'; }
}
function doLogout() { localStorage.removeItem('zs_auth'); location.reload(); }

// --- CACHE ---
const Cache = {
  get(k) { try { return JSON.parse(localStorage.getItem('hs_' + k)) || []; } catch { return []; } },
  set(k, v) { localStorage.setItem('hs_' + k, JSON.stringify(v)); },
  add(k, item) { const d = this.get(k); if (!d.find(x => x.id === item.id)) { d.unshift(item); this.set(k, d); } this.updateCounts(); },
  remove(k, id) { this.set(k, this.get(k).filter(x => x.id !== id)); this.updateCounts(); },
  has(k, id) { return this.get(k).some(x => x.id === id); },
  updateCounts() { document.getElementById('favCount').textContent = this.get('fav').length; document.getElementById('histCount').textContent = this.get('hist').length; }
};
Cache.updateCounts();

let view = 'main', cat = 'all', allMovies = [], allCats = [], currentMovie = null, dynamicSources = [];
const stage = document.getElementById('stage');

function switchView(v) {
  view = v;
  document.querySelectorAll('.navlink').forEach(l => l.classList.remove('active'));
  document.querySelector(`.navlink[data-view="${v}"]`)?.classList.add('active');
  document.getElementById('hero').classList.remove('visible');
  document.getElementById('catbar').style.display = 'none';
  document.getElementById('sections').innerHTML = '';
  document.getElementById('empty').style.display = 'none';
  if (v === 'main') stage.classList.remove('pad-top'); else stage.classList.add('pad-top');
  
  if (view === 'main') { document.getElementById('catbar').style.display = 'flex'; if (allMovies.length > 0) initHero(allMovies); renderSections(allMovies, allCats); }
  else if (view === 'favorites') { const f = Cache.get('fav'); if (f.length === 0) showEmpty('Favorites Empty', 'Click the heart icon...'); else renderSection('Favorites', f); }
  else if (view === 'history') { const h = Cache.get('hist'); if (h.length === 0) showEmpty('History Empty', 'You haven\'t watched...'); else renderSection('Recently Watched', h); }
  else { const f = allMovies.filter(m => m.type === v); if (f.length === 0) showEmpty('No Content', `No ${v} found.`); else renderSection(null, f); }
}
function showEmpty(t, d) { document.getElementById('emptyTitle').textContent = t; document.getElementById('emptyDesc').textContent = d; document.getElementById('empty').style.display = 'flex'; }

// --- LIVE SEARCH ---
let st;
async function handleSearch() {
  clearTimeout(st); const q = document.getElementById('searchInput').value.trim(), dd = document.getElementById('searchDropdown');
  if (q.length < 2) { dd.style.display = 'none'; return; }
  st = setTimeout(async () => {
    try {
      const r = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`); const res = await r.json();
      if (res.length > 0) { 
        dd.innerHTML = res.map(m => {
          const rating = parseFloat(m.rating).toFixed(1);
          return `<div class="search-item" onclick="openPlayer(${m.id}); document.getElementById('searchInput').value=''; document.getElementById('searchDropdown').style.display='none';"><img src="${m.poster}" alt="${m.title}"><div class="search-item-info"><div class="search-item-title">${m.title}</div><div class="search-item-meta">${m.release_date} • ${m.genre} • ⭐ ${rating}</div></div></div>`;
        }).join(''); dd.style.display = 'block'; 
      }
      else { dd.innerHTML = '<div class="search-item"><div class="search-item-info"><div class="search-item-title">No results found</div></div></div>'; dd.style.display = 'block'; }
    } catch (e) {}
  }, 300);
}
document.addEventListener('click', (e) => { if (!e.target.closest('.searchbox')) document.getElementById('searchDropdown').style.display = 'none'; });

// --- APIS ---
async function fetchMovies() { try { const r = await fetch(`${API_BASE}/movies`); return r.ok ? r.json() : []; } catch (e) { return []; } }
async function fetchCats() { try { const r = await fetch(`${API_BASE}/categories`); return r.ok ? r.json() : [{id:'all', name:'All'}]; } catch (e) { return [{id:'all', name:'All'}]; } }
async function fetchSources(id) { 
  try { 
    const r = await fetch(`${API_BASE}/sources?id=${id}`); 
    if (!r.ok) return [];
    const data = await r.json();
    return Array.isArray(data) ? data : [];
  } catch (e) { 
    return []; 
  } 
}

// --- HERO SLIDER LOGIC ---
let heroItems = [], heroIndex = 0, heroInterval;

function initHero(items) {
  heroItems = [...items].sort((a, b) => new Date(b.release_date || '1970-01-01') - new Date(a.release_date || '1970-01-01')).slice(0, 10);
  if (heroItems.length === 0) return;
  
  document.getElementById('heroDots').innerHTML = heroItems.map((_, i) => `<div class="hero-dot ${i===0?'active':''}" onclick="changeHero(${i})"></div>`).join('');
  changeHero(0);
  startHeroAuto();
}

function changeHero(index) {
  heroIndex = index;
  renderHero(heroItems[index]);
  document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === index));
}

function nextHero() { let n = heroIndex + 1; if (n >= heroItems.length) n = 0; changeHero(n); }
function prevHero() { let n = heroIndex - 1; if (n < 0) n = heroItems.length - 1; changeHero(n); }

function startHeroAuto() {
  clearInterval(heroInterval);
  heroInterval = setInterval(nextHero, 8000);
}

function renderHero(m) {
  if (!m) return;
  const rating = parseFloat(m.rating).toFixed(1);
  document.getElementById('heroBackdrop').style.backgroundImage = `url('${m.backdrop}')`;
  document.getElementById('heroTitle').textContent = m.title.toUpperCase();
  document.getElementById('heroMeta').innerHTML = `<span class="star">⭐ ${rating}</span><span class="dot"></span><span>${m.release_date}</span><span class="dot"></span><span>${m.genre}</span>`;
  document.getElementById('heroDesc').textContent = m.overview;
  document.getElementById('heroActs').innerHTML = `<button class="btn btn-lava" onclick="openPlayer(${m.id})">Watch Now</button><button class="btn btn-ghost" onclick="toggleFav(${m.id})">${Cache.has('fav',m.id)?'In Favorites':'Add to Favorites'}</button>`;
  document.getElementById('hero').classList.add('visible');
}

function renderCats(cats) { document.getElementById('catbar').innerHTML = cats.map(c => `<div class="catpill ${c.id==='all'?'active':''}" data-cat="${c.id}" onclick="filterCategory('${c.id}')">${c.name}</div>`).join(''); }
function skel(c=6) { return Array(c).fill(0).map(()=>`<div class="skel-card"><div class="skel-img"></div><div class="skel-line"></div><div class="skel-line s"></div></div>`).join(''); }

function card(m) {
  const fav = Cache.has('fav', m.id);
  const rating = parseFloat(m.rating).toFixed(1);
  return `<div class="card"><div style="position:relative;overflow:hidden;" onclick="openPlayer(${m.id})"><img src="${m.poster}" class="card-img" alt="${m.title}" loading="lazy"><div class="card-badges"><div class="badge-rate">${rating}</div></div><div class="card-overlay"><div class="playbtn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div></div><button class="card-fav" onclick="event.stopPropagation();toggleFav(${m.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button><div class="card-info"><div class="card-title">${m.title}</div><div class="card-meta"><span>${m.release_date}</span><span class="sep"></span><span>${m.genre}</span></div></div></div>`;
}

function renderSection(title, movies, sid='') {
  const id = sid || 's_' + Math.random().toString(36).substr(2, 9);
  const hh = title ? `<div class="sec-head"><h2 class="sec-title">${title}</h2></div>` : '';
  document.getElementById('sections').insertAdjacentHTML('beforeend', `${hh}<div class="grid" id="${id}">${movies.length>0?movies.map(card).join(''):skel()}</div>`);
}

function renderSections(movies, cats) {
  document.getElementById('sections').innerHTML = '';
  if (cat !== 'all') { const f = movies.filter(m => m.genre === cat); renderSection(cat, f); return; }
  const gmap = {}; movies.forEach(m => { if(!gmap[m.genre]) gmap[m.genre]=[]; gmap[m.genre].push(m); });
  Object.entries(gmap).forEach(([g,items]) => renderSection(g, items));
}

function filterCategory(cid) { cat = cid; document.querySelectorAll('.catpill').forEach(t => t.classList.remove('active')); document.querySelector(`.catpill[data-cat="${cid}"]`)?.classList.add('active'); if (view === 'main') renderSections(allMovies, allCats); }

function toggleFav(id) {
  const m = allMovies.find(x => x.id === id) || currentMovie; if (!m) return;
  if (Cache.has('fav', id)) Cache.remove('fav', id); else Cache.add('fav', m);
  if (view === 'favorites') switchView('favorites');
  else if (view === 'main') { if (heroItems[heroIndex] && heroItems[heroIndex].id === id) renderHero(heroItems[heroIndex]); renderSections(allMovies, allCats); }
  if (currentMovie && currentMovie.id === id) updatePlayerFavBtn();
}

// --- PLAYER LOGIC ---
async function openPlayer(id) {
  try {
    const r = await fetch(`${API_BASE}/movie/${id}`);
    if (r.ok) currentMovie = await r.json();
  } catch (e) {}
  
  if (currentMovie) Cache.add('hist', currentMovie);
  
  document.getElementById('nowPlayingTitle').textContent = currentMovie?.title || 'Unknown';
  document.getElementById('tmdbIdDisplay').textContent = currentMovie?.id || 'N/A';
  document.getElementById('portalTitle').textContent = (currentMovie?.title || 'Unknown').toUpperCase();
  document.getElementById('portal').classList.add('on');
  document.body.style.overflow = 'hidden';
  
  const iframe = document.getElementById('uvideo');
  iframe.src = 'about:blank';
  iframe.style.display = 'none';
  document.getElementById('vplaceholder').style.display = 'block';
  
  dynamicSources = await fetchSources(id);
  document.getElementById('nodelist').innerHTML = dynamicSources.length > 0 
    ? dynamicSources.map((s, i) => `<div class="server-btn ${i===0?'active':''}" onclick="selSrc(this, '${s.name}')">${s.name}</div>`).join('')
    : '<p style="color: var(--ash); text-align: center; grid-column: 1/-1;">No sources found.</p>';
    
  if (dynamicSources.length > 0) selSrc(document.querySelector('.server-btn'), dynamicSources[0].name);
  updatePlayerFavBtn();
}

function updatePlayerFavBtn() { document.getElementById('playerFavBtn').innerHTML = (currentMovie && Cache.has('fav', currentMovie.id)) ? 'Favorited' : 'Favorite'; }
function togglePlayerFav() { if (currentMovie) toggleFav(currentMovie.id); }

function selSrc(btn, name) {
  if (!btn) return;
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const source = dynamicSources.find(s => s.name === name); if (!source) return;
  const iframe = document.getElementById('uvideo');
  document.getElementById('vplaceholder').style.display = 'none'; 
  iframe.style.display = 'block';
  iframe.src = source.url;
}

function closePlayer() { 
  document.getElementById('portal').classList.remove('on'); 
  document.body.style.overflow = ''; 
  const iframe = document.getElementById('uvideo'); 
  iframe.src = 'about:blank'; 
  currentMovie = null; 
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closePlayer(); });

// --- SYNC ENGINE UI ---
async function startSync() {
  document.getElementById('syncBtn').disabled = true;
  document.getElementById('syncBtn').innerText = 'Syncing...';
  await fetch(`${API_BASE}/start-sync`);
  checkSyncStatus();
}
let syncInterval;
async function checkSyncStatus() {
  clearInterval(syncInterval);
  syncInterval = setInterval(async () => {
    try {
      const r = await fetch(`${API_BASE}/sync-status`);
      const data = await r.json();
      const btn = document.getElementById('syncBtn');
      const txt = document.getElementById('syncStatusText');
      if (data.isSyncing) {
        txt.innerHTML = `Status: Syncing <b>${data.category}</b><br>Page: ${data.currentPage}<br>Cached Items: ${data.totalItems}`;
        btn.disabled = true; btn.innerText = 'Syncing...';
      } else {
        txt.innerHTML = `Status: Idle / Complete<br>Cached Items: ${data.totalItems}`;
        btn.disabled = false; btn.innerText = 'Start Caching TMDB';
      }
    } catch (e) {}
  }, 2000);
}

async function init() {
  document.getElementById('sections').innerHTML = `<div class="sec-head"><h2 class="sec-title">Loading Database...</h2></div><div class="grid">${skel(6)}</div>`;
  const [movies, cats] = await Promise.all([fetchMovies(), fetchCats()]);
  allMovies = movies; allCats = cats;
  renderCats(cats);
  if (allMovies.length > 0) initHero(allMovies);
  renderSections(allMovies, cats);
}

checkAuth();
</script>
</body>
</html>
