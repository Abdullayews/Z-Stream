<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Stream — Infernal Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --void:#000; --crust:#0a0203;
  --lava:#E50914; --flame:#FF3333; --solar:#FF4D4D; --ember:#FF6B35;
  --gold:#FBBF24; --fog:#E5E5E5; --ash:#A1A1A1; --dust:#717171;
  --text:#fff; --text-dim:#c9c9c9;
  --border:rgba(229,9,20,.22); --border-hover:rgba(229,9,20,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--void);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.atmosphere{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 80% 60% at 12% 45%, rgba(229,9,20,.13) 0%, transparent 55%),
  radial-gradient(ellipse 50% 40% at 88% 15%, rgba(255,107,53,.06) 0%, transparent 55%)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 85% 85% at 50% 50%, transparent 35%, rgba(0,0,0,.82) 100%)}
:focus-visible{outline:2px solid var(--lava);outline-offset:2px;border-radius:8px}

/* ── Login ── */
.login-portal{position:fixed;inset:0;z-index:5000;background:var(--void);display:none;align-items:center;justify-content:center}
.login-box{background:rgba(14,2,3,.92);border:1px solid var(--border);border-radius:24px;padding:44px;width:min(92vw,400px);
  box-shadow:0 24px 64px #000c, 0 0 90px rgba(229,9,20,.14);animation:riseIn .7s cubic-bezier(.16,1,.3,1)}
@keyframes riseIn{from{opacity:0;transform:translateY(34px) scale(.97)}to{opacity:1;transform:none}}
.login-box h1{font-family:'Orbitron';font-size:23px;letter-spacing:5px;text-align:center;text-transform:uppercase;margin-bottom:8px;
  background:linear-gradient(120deg,#fff 30%,var(--lava));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-sub{text-align:center;color:var(--dust);font-size:12px;margin-bottom:30px;letter-spacing:1px}
.login-input{width:100%;padding:14px 18px;background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;margin-bottom:14px;transition:.3s}
.login-input:focus{border-color:var(--lava);box-shadow:0 0 0 3px rgba(229,9,20,.18);outline:none}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#C40612,var(--lava) 60%,var(--flame));border:none;border-radius:12px;color:#fff;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.3s cubic-bezier(.16,1,.3,1)}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(229,9,20,.5)}
.login-btn:disabled{opacity:.55;cursor:wait}
.login-error,.login-status{display:none;margin-top:16px;font-size:12.5px;line-height:1.6;text-align:center;border-radius:10px;padding:10px 14px}
.login-error{color:#ff4444}
.login-status{background:rgba(229,9,20,.08);border:1px solid var(--border);color:var(--solar)}
.login-hint{text-align:center;font-size:11px;color:var(--dust);margin-top:18px}
.login-hint b{color:var(--ash)}

/* ── Topbar ── */
.topbar{position:sticky;top:0;z-index:200;background:rgba(0,0,0,.72);backdrop-filter:blur(28px) saturate(170%);border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 40px;gap:16px}
.brand-name{font-family:'Orbitron';font-size:18px;font-weight:900;letter-spacing:5px;color:#fff;background:none;border:none;cursor:pointer;text-transform:uppercase;
  text-shadow:0 0 30px rgba(229,9,20,.5);transition:.3s}
.brand-name:hover{letter-spacing:7px}
.navlinks{display:flex;gap:2px;background:rgba(20,1,2,.5);border:1px solid var(--border);padding:4px;border-radius:30px;backdrop-filter:blur(10px)}
.navlink{position:relative;padding:8px 18px;border-radius:20px;cursor:pointer;color:var(--fog);font-size:13px;font-weight:500;border:none;background:transparent;transition:.3s;display:flex;align-items:center;gap:6px}
.navlink:hover{color:#fff;background:rgba(229,9,20,.12)}
.navlink.active{color:#fff;background:linear-gradient(135deg,rgba(229,9,20,.35),rgba(255,26,26,.18))}
.badge{font-family:'Orbitron';font-size:9px;padding:2px 7px;background:rgba(229,9,20,.35);border-radius:6px;color:var(--solar);min-width:20px;text-align:center}
.header-right{display:flex;align-items:center;gap:10px}
.searchbox{position:relative;width:260px}
.searchbox input{width:100%;padding:9px 14px 9px 36px;background:rgba(20,1,2,.5);border:1px solid var(--border);border-radius:22px;color:var(--text);font-size:12.5px;backdrop-filter:blur(10px);transition:.35s}
.searchbox input:focus{border-color:var(--lava);box-shadow:0 0 0 3px rgba(229,9,20,.18);outline:none;width:290px}
.searchbox .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ash);pointer-events:none}
.search-dropdown{position:absolute;top:100%;right:0;width:360px;margin-top:8px;background:rgba(12,2,2,.97);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 48px #000d;max-height:430px;overflow-y:auto;padding:8px;display:none;z-index:100;animation:ddIn .25s cubic-bezier(.16,1,.3,1)}
@keyframes ddIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.search-item{display:flex;gap:12px;width:100%;padding:10px;border-radius:12px;cursor:pointer;background:none;border:none;text-align:left;color:inherit;transition:.2s}
.search-item:hover,.search-item:focus{background:rgba(229,9,20,.12)}
.search-item img{width:42px;height:62px;object-fit:cover;border-radius:8px;background:#150203;flex-shrink:0}
.search-item-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item-meta{color:var(--ash);font-size:11.5px;margin-top:3px}
.type-tag{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--solar);background:rgba(229,9,20,.16);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-right:8px}
.logout-btn{width:38px;height:38px;border-radius:11px;background:rgba(20,1,2,.5);border:1px solid var(--border);color:var(--ash);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.25s}
.logout-btn:hover{background:rgba(229,9,20,.22);color:var(--flame);border-color:var(--lava);transform:rotate(-8deg)}

.tabbar{display:none}

/* ── Hero ── */
.stage{position:relative;z-index:2;padding-bottom:96px}
.stage.pad-top{padding-top:92px}
.hero{position:relative;width:100vw;height:94vh;min-height:520px;overflow:hidden;display:none;align-items:flex-end;padding:80px;isolation:isolate}
.hero.visible{display:flex}
.hero-backdrop{position:absolute;inset:-4%;z-index:-2;opacity:.58;background-size:cover;background-position:center 18%;
  filter:saturate(.85) contrast(1.12) brightness(.85);
  mask-image:linear-gradient(0deg,#000 22%,transparent 96%);-webkit-mask-image:linear-gradient(0deg,#000 22%,transparent 96%);transition:opacity 1s ease}
.hero-backdrop.fade{opacity:0}
.hero::after{content:'';position:absolute;inset:auto 0 0 0;height:68%;z-index:-1;
  background:linear-gradient(0deg,#000 2%,rgba(0,0,0,.55) 46%,transparent 100%)}
.hero-body{position:relative;z-index:2;max-width:700px;padding-bottom:56px}
.hero-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;background:rgba(229,9,20,.16);border:1px solid var(--border);border-radius:24px;
  font-size:10px;font-weight:600;letter-spacing:3.5px;color:var(--flame);margin-bottom:22px;backdrop-filter:blur(10px);text-transform:uppercase}
.hero-chip::before{content:'';width:6px;height:6px;background:var(--lava);border-radius:50%;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 6px var(--lava)}50%{box-shadow:0 0 18px var(--lava),0 0 30px rgba(229,9,20,.5)}}
.hero-title{font-family:'Orbitron';font-size:clamp(32px,4.6vw,60px);font-weight:900;line-height:1.06;margin-bottom:16px;letter-spacing:3px;
  animation:heroText .8s cubic-bezier(.16,1,.3,1) both}
@keyframes heroText{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero-meta,.hero-desc,.hero-acts{animation:heroText .8s cubic-bezier(.16,1,.3,1) both}
.hero-meta{animation-delay:.08s}.hero-desc{animation-delay:.16s}.hero-acts{animation-delay:.24s}
.hero-meta{display:flex;align-items:center;gap:15px;margin-bottom:16px;font-size:13.5px;color:var(--fog);flex-wrap:wrap}
.hero-meta .star{color:var(--gold);font-weight:700}
.hero-meta .dot{width:4px;height:4px;background:var(--lava);border-radius:50%;box-shadow:0 0 6px var(--lava)}
.hero-desc{font-size:15.5px;line-height:1.8;color:var(--text-dim);margin-bottom:32px;max-width:540px;font-weight:300}
.hero-acts{display:flex;gap:14px;flex-wrap:wrap}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:52px;line-height:1;color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;z-index:3;padding:8px 22px;transition:.25s}
.hero-arrow:hover{color:var(--lava);text-shadow:0 0 20px rgba(229,9,20,.7)}
.hero-arrow.left{left:0}.hero-arrow.right{right:0}
.hero-dots{position:absolute;bottom:36px;left:80px;display:flex;gap:8px;z-index:3}
.hero-dot{width:32px;height:4px;border:none;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;padding:0;transition:.4s}
.hero-dot:hover{background:rgba(255,255,255,.45)}
.hero-dot.active{background:var(--lava);box-shadow:0 0 12px var(--lava);width:52px}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 27px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;transition:.35s cubic-bezier(.16,1,.3,1);border:none;text-decoration:none}
.btn-lava{background:linear-gradient(135deg,#C40612,var(--lava) 55%,var(--flame));color:#fff;box-shadow:0 4px 22px rgba(229,9,20,.45);overflow:hidden;position:relative}
.btn-lava::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
.btn-lava:hover::after{transform:translateX(120%)}
.btn-lava:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(229,9,20,.55)}
.btn-ghost{background:rgba(20,1,2,.55);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(10px);transition:.3s}
.btn-ghost:hover{background:rgba(229,9,20,.16);border-color:var(--border-hover);transform:translateY(-2px)}

/* ── Categories / sections — 10×2 grid, max 20 per category ── */
.catbar{display:flex;gap:10px;margin:40px 0 30px;flex-wrap:wrap;padding:0 40px}
.catpill{padding:10px 22px;border-radius:13px;background:rgba(20,1,2,.5);border:1px solid var(--border);color:var(--fog);font-size:13px;font-weight:500;cursor:pointer;transition:.3s cubic-bezier(.16,1,.3,1);white-space:nowrap}
.catpill:hover{background:rgba(229,9,20,.16);color:#fff;transform:translateY(-2px);border-color:var(--border-hover)}
.catpill.active{background:linear-gradient(135deg,rgba(229,9,20,.3),rgba(255,26,26,.16));border-color:var(--lava);color:#fff;box-shadow:0 0 20px rgba(229,9,20,.18)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;padding:0 40px}
.sec-title{font-family:'Orbitron';font-size:16px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.sec-title::before{content:'';width:5px;height:24px;background:var(--lava);border-radius:3px;box-shadow:0 0 16px var(--lava)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:24px 12px;margin-bottom:56px;padding:0 40px}
@media (max-width:1500px){.grid{grid-template-columns:repeat(8,1fr)}}
@media (max-width:1250px){.grid{grid-template-columns:repeat(6,1fr)}}
@media (max-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:780px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:18px 10px}}
@media (max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}

/* ── Cards ── */
.card{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:rgba(12,2,3,.55);cursor:pointer;
  opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s}
.card.shown{opacity:1;transform:none}
.card:hover{transform:translateY(-9px) scale(1.02)!important;border-color:var(--lava);box-shadow:0 30px 56px #000d,0 0 64px rgba(229,9,20,.14)}
.card-img-wrap{position:relative;overflow:hidden}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.card:hover .card-img{transform:scale(1.08)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 32%,rgba(0,0,0,.95));opacity:0;transition:.35s;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:16px}
.card:hover .card-overlay{opacity:1}
.playbtn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#C40612,var(--lava));display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 6px 24px rgba(229,9,20,.65);transform:scale(.75);transition:.35s cubic-bezier(.34,1.56,.64,1)}
.card:hover .playbtn{transform:scale(1)}
.playbtn svg{width:18px;fill:#fff;margin-left:2px}
.badge-rate{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:4px;padding:4px 8px;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);border-radius:8px;font-size:10.5px;font-weight:700;color:var(--gold)}
.ep-chip{position:absolute;bottom:14px;left:10px;padding:4px 9px;background:rgba(0,0,0,.75);backdrop-filter:blur(14px);border-radius:8px;font-size:10px;font-weight:800;color:var(--flame);letter-spacing:.5px}
.progress-track{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.14)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--lava),var(--flame));box-shadow:0 0 8px var(--lava)}
.card-fav{position:absolute;top:10px;right:10px;z-index:4;width:29px;height:29px;border-radius:9px;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ash);opacity:0;transform:scale(.8);transition:.3s}
.card:hover .card-fav{opacity:1;transform:scale(1)}
.card-fav:hover{background:rgba(229,9,20,.4);border-color:var(--lava);transform:scale(1.12)!important}
.card-fav.active{color:var(--lava);opacity:1}
.card-info{padding:11px 13px}
.card-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:10.5px;color:var(--ash);display:flex;gap:8px;margin-top:4px}

.skel-card{border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.skel-img{aspect-ratio:2/3;background:linear-gradient(90deg,#100101 25%,rgba(229,9,20,.08) 50%,#100101 75%);background-size:200% 100%;animation:shimmer 1.8s infinite}
.skel-line{height:12px;margin:11px 13px;border-radius:6px;background:linear-gradient(90deg,#100101 25%,rgba(229,9,20,.08) 50%,#100101 75%);background-size:200% 100%;animation:shimmer 1.8s infinite}
.skel-line.s{width:55%;height:9px}
@keyframes shimmer{to{background-position:-200% 0}}

.empty{min-height:60vh;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 20px;color:var(--ash);animation:riseIn .6s both}
.empty h3{font-family:'Orbitron';font-size:19px;color:var(--fog);margin-bottom:12px;letter-spacing:2px}
.empty p{max-width:420px;color:var(--dust);margin-bottom:22px;line-height:1.7}

/* ── Detail portal ── */
.portal{position:fixed;inset:0;background:#000;z-index:1000;overflow-y:auto;display:none}
.portal.on{display:block;animation:portalIn .45s cubic-bezier(.16,1,.3,1)}
@keyframes portalIn{from{opacity:0;transform:translateY(40px) scale(.985)}to{opacity:1;transform:none}}
.portal-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:13px 40px;background:rgba(0,0,0,.82);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);z-index:10}
.portal-title{font-family:'Orbitron';font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fog)}
.portal-x{background:none;border:none;color:var(--ash);cursor:pointer;transition:.25s;padding:4px}
.portal-x:hover{color:var(--lava);transform:rotate(90deg)}
.portal-body{max-width:1100px;margin:0 auto;padding:34px 40px 70px;display:flex;flex-direction:column;gap:28px}
.detail-hero{display:flex;gap:30px}
.detail-poster{width:195px;aspect-ratio:2/3;object-fit:cover;border-radius:15px;background:#150203;flex-shrink:0;border:1px solid var(--border);box-shadow:0 18px 48px #000b}
.detail-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.detail-title{font-family:'Orbitron';font-size:clamp(21px,2.6vw,27px);line-height:1.3}
.detail-meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ash);flex-wrap:wrap}
.detail-meta .star{color:var(--gold);font-weight:700}
.type-big{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
  background:linear-gradient(135deg,rgba(229,9,20,.3),rgba(255,26,26,.15));border:1px solid var(--border);color:var(--solar)}
.detail-desc{font-size:14.5px;line-height:1.78;color:var(--text-dim)}
.heart-btn{background:rgba(20,1,2,.5);border:1px solid var(--border);cursor:pointer;color:var(--ash);transition:.3s;flex-shrink:0;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.heart-btn:hover{color:var(--flame);border-color:var(--lava);transform:scale(1.08)}
.heart-btn.active{color:var(--lava);border-color:var(--lava);background:rgba(229,9,20,.14)}
.watch-section{background:linear-gradient(170deg,rgba(229,9,20,.05),transparent),rgba(12,2,3,.6);border:1px solid var(--border);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:15px}
.sub-head{font-family:'Orbitron';font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:var(--fog)}
.sub-head::before{content:'';width:4px;height:18px;background:var(--lava);border-radius:2px;box-shadow:0 0 12px var(--lava)}

/* ── Player slot — iframe is EXACTLY: src + allowfullscreen + webkitallowfullscreen + scrolling ── */
.vframe{position:relative;width:min(100%,calc((100vh - 120px) * 16 / 9));max-height:calc(100vh - 120px);aspect-ratio:16/9;margin:0 auto;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 20px 50px #000c}
@supports (height:100dvh){.vframe{width:min(100%,calc((100dvh - 120px) * 16 / 9));max-height:calc(100dvh - 120px)}}
.vframe iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vplaceholder{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--ash);padding:24px;z-index:2}
.vplaceholder p{font-size:14px;max-width:440px;line-height:1.7}
.vplaceholder .big{font-size:16px;font-weight:700;color:var(--fog)}
.vplaceholder a{color:var(--flame)}
.spinner{width:42px;height:42px;border:3px solid rgba(229,9,20,.2);border-top-color:var(--lava);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.server-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.server-btn{padding:13px 10px;background:rgba(20,1,2,.55);border:1px solid var(--border);border-radius:11px;color:var(--fog);font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s;text-align:center}
.server-btn:hover{background:rgba(229,9,20,.14);color:#fff;transform:translateY(-2px);border-color:var(--border-hover)}
.server-btn.active{background:linear-gradient(135deg,#C40612,var(--lava));border-color:var(--lava);color:#fff;box-shadow:0 4px 15px rgba(229,9,20,.4)}

.provider-grid{display:flex;gap:10px;flex-wrap:wrap}
.provider-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 19px;background:rgba(20,1,2,.55);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:.3s cubic-bezier(.16,1,.3,1)}
.provider-btn:hover{border-color:var(--lava);background:rgba(229,9,20,.13);transform:translateY(-3px);box-shadow:0 10px 26px rgba(229,9,20,.2)}
.provider-logo{width:24px;height:24px;border-radius:6px;object-fit:cover}
.src-note{color:var(--dust);font-size:13px;line-height:1.7}
.seasons-bar{display:flex;gap:8px;flex-wrap:wrap}
.season-pill{padding:9px 19px;background:rgba(20,1,2,.5);border:1px solid var(--border);border-radius:22px;color:var(--fog);font-size:13px;cursor:pointer;transition:.25s}
.season-pill:hover{border-color:var(--border-hover);color:#fff}
.season-pill.active{background:linear-gradient(135deg,var(--lava),#a8050e);border-color:var(--lava);color:#fff;box-shadow:0 4px 16px rgba(229,9,20,.35)}
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.ep-btn{padding:13px;background:rgba(20,1,2,.5);border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:.25s}
.ep-btn:hover{border-color:var(--lava);background:rgba(229,9,20,.12);transform:translateY(-2px)}
.ep-btn.selected{background:rgba(229,9,20,.22);border-color:var(--lava);color:#fff}
.cast-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.cast-card{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:86px;text-align:center;transition:.3s}
.cast-card:hover{transform:translateY(-4px)}
.cast-card img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:#150203;transition:.3s}
.cast-card:hover img{border-color:var(--lava);box-shadow:0 0 18px rgba(229,9,20,.35)}
.cast-name{font-size:11.5px;color:var(--fog);font-weight:600}
.cast-role{font-size:10px;color:var(--dust)}

/* ── Toast / sync panel ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);background:rgba(14,2,3,.95);border:1px solid var(--border);
  color:#fff;padding:13px 24px;border-radius:14px;font-size:13px;z-index:3000;backdrop-filter:blur(20px);box-shadow:0 12px 36px #000c;transition:transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.sync-panel{position:fixed;bottom:20px;right:20px;background:rgba(14,2,3,.92);border:1px solid var(--border);backdrop-filter:blur(20px);padding:20px;border-radius:16px;z-index:500;box-shadow:0 10px 30px #000c;display:none;min-width:290px}
.sync-panel h4{font-family:'Orbitron';font-size:14px;color:var(--lava);margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}
.sync-panel p{font-size:12px;color:var(--fog);margin-bottom:15px;line-height:1.6}
.sync-btn{width:100%;padding:10px;background:var(--lava);border:none;border-radius:9px;color:#fff;font-weight:700;cursor:pointer;letter-spacing:1px}
.sync-btn:hover{background:var(--flame)}
.sync-btn:disabled{background:var(--ash);cursor:not-allowed}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#4d0a0f;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--lava)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

@media (max-width:900px){
  .topbar-inner,.grid,.sec-head,.catbar,.portal-body,.portal-head{padding-left:18px;padding-right:18px}
  .navlinks{display:none}
  .hero{padding:30px;height:80vh}
  .hero-dots{left:30px;bottom:20px}
  .hero-arrow{display:none}
  .searchbox{width:170px}
  .detail-hero{flex-direction:column;align-items:center}
}
@media (max-width:768px){
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(10,1,2,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:none;border:none;color:var(--dust);font-size:10px;cursor:pointer;transition:.2s}
  .tabbar button.active{color:var(--flame)}
  .stage{padding-bottom:112px}
  .logout-btn{display:none}
  .sync-panel{bottom:78px}
}
</style>
</head>
<body>

<div id="loginPortal" class="login-portal">
  <div class="login-box">

  </div>
</div>

<div class="atmosphere"></div>
<div class="vignette"></div>

<nav class="topbar">
  <div class="topbar-inner">
    <button class="brand-name" data-view="home">Z-Stream</button>
    <div class="navlinks">
      <button class="navlink active" data-view="home">Home</button>

        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search…" autocomplete="off" aria-label="Search titles">
        <div class="search-dropdown" id="searchDropdown" role="listbox"></div>

      <button class="logout-btn" id="logoutBtn" title="Log out" aria-label="Log out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>

<!-- Details portal -->

<div class="toast" id="toast"></div>

<div class="sync-panel" id="syncPanel">
  <h4>Database Sync</h4>
  <p id="syncStatusText">Status: Idle</p>
  <button class="sync-btn" id="syncBtn">Start Caching TMDB</button>
</div>

<script>
'use strict';

const API_BASE = '/api';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtRating = r => Number(r || 0).toFixed(1);
const PLACEHOLDER = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 450'%3E%3Crect width='300' height='450' fill='%23150203'/%3E%3Ctext x='150' y='230' fill='%235a2226' font-family='sans-serif' font-size='16' text-anchor='middle'%3ENo Poster%3C/text%3E%3C/svg%3E";
function imgFallback(img){ img.onerror = null; img.src = PLACEHOLDER; }
function removeEmbed(){ const f = document.querySelector('#vframe iframe'); if (f) f.remove(); }

/* ═══════════ Storage ═══════════ */
const Store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('zs_'+k)) || []; }catch{ return []; } },
  set(k,v){ localStorage.setItem('zs_'+k, JSON.stringify(v)); },
  has(k,id){ return this.get(k).some(x => x.id === id); },
  find(k,id){ return this.get(k).find(x => x.id === id); },
  add(k,item){
    const d = this.get(k).filter(x => x.id !== item.id);
    d.unshift(item);
    if (k === 'hist' && d.length > 60) d.length = 60;
    this.set(k,d); updateCounts();
  },
  remove(k,id){ this.set(k,this.get(k).filter(x => x.id !== id)); updateCounts(); },
  toggle(k,item){ this.has(k,item.id) ? this.remove(k,item.id) : this.add(k,item); }
};
function updateCounts(){
  $('favCount').textContent = Store.get('fav').length;
  $('histCount').textContent = Store.get('hist').length;
}
function progressPct(h){
  if (!h || !h.runtime || !h.minutesWatched) return 0;
  return Math.min(100, Math.round((h.minutesWatched / h.runtime) * 100));
}
function fmtMinutes(m){
  if (!m || m <= 0) return 'Not started';
  if (m < 60) return Math.round(m) + ' min watched';
  const h = Math.floor(m/60), mm = Math.round(m%60);
  return h + 'h ' + mm + 'm watched';
}

/* ═══════════ Auth ═══════════ */
function checkAuth(){
  if (localStorage.getItem('zs_auth') === 'true'){
    startApp();
  } else {
    $('loginPortal').style.display = 'flex';
    probeHealth();
  }
}
async function probeHealth(){
  try{
    const r = await fetch(API_BASE + '/health');
    const h = await r.json();
    if (!h.db){
      $('loginStatus').textContent = h.dbError || 'Database unreachable — check /api/health';
      $('loginStatus').style.display = 'block';
    } else if (h.tables && (h.tables.movies_cache === 'MISSING' || h.tables.series_cache === 'MISSING')){
      $('loginStatus').textContent = 'Cache tables missing — run a sync after logging in.';
      $('loginStatus').style.display = 'block';
    }
  }catch(e){}
}
async function doLogin(){
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  const err = $('loginError'), btn = $('loginBtn');
  err.style.display = 'none';
  if (!u || !p){ err.textContent = 'Enter both username and password.'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 60000);
  try{
    const r = await fetch(API_BASE + '/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username:u, password:p }), signal: ctrl.signal
    });
    clearTimeout(to);
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.success){
      localStorage.setItem('zs_auth','true');
      return startApp();
    }
    if (data.error === 'db_down') err.textContent = 'Database problem: ' + (data.message || 'see /api/health');
    else if (data.error === 'rate_limited') err.textContent = data.message || 'Too many attempts. Wait a few minutes.';
    else err.textContent = data.message || 'Invalid username or password.';
  }catch(e){
    clearTimeout(to);
    err.textContent = e.name === 'AbortError'
      ? 'Server took too long — it may be waking up (Render free tier). Try again shortly.'
      : 'Cannot reach the server.';
  }finally{
    btn.disabled = false; btn.textContent = 'Sign In';
    err.style.display = 'block';
  }
}
 $('loginBtn').addEventListener('click', doLogin);
['loginUser','loginPass'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
 $('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('zs_auth');
  location.reload();
});

/* ═══════════ State ═══════════ */
let view = 'home', cat = 'all', allMovies = [], currentMovie = null;
let heroItems = [], heroIndex = 0, heroInterval = null;
let activeSeason = 1, activeEpisode = 1, seasons = [], dynamicSources = [], preferredSource = null;
let watchTimer = null;

async function startApp(){
  $('loginPortal').style.display = 'none';
  updateCounts();
  loadTabbar(); initSearch(); initKeyboard(); bindStaticEvents(); initSyncPanel();

  $('sections').innerHTML =
    '<div class="sec-head"><h2 class="sec-title">Loading…</h2></div><div class="grid">' + skel(20) + '</div>';
  allMovies = await fetchMovies();
  renderView();
}

/* ═══════════ API ═══════════ */
async function api(path){
  try{
    const r = await fetch(API_BASE + path);
    return r.ok ? r.json() : null;
  }catch{ return null; }
}
async function fetchMovies(){
  const d = await api('/movies');
  return Array.isArray(d) ? d : [];
}

/* ═══════════ Views ═══════════ */
function switchView(v){
  view = v; stopHero();
  document.querySelectorAll('.navlink, .tabbar button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === v));
  $('hero').classList.remove('visible');
  $('catbar').style.display = 'none';
  $('sections').innerHTML = ''; hideEmpty();
  window.scrollTo({ top: 0 });
  $('stage').classList.toggle('pad-top', v !== 'home');
  renderView();
}
function renderView(){
  if (view === 'home'){
    if (allMovies.length){ renderSections(allMovies); initHero(allMovies); }
    else showEmpty('Database Empty','Run a TMDB sync from the panel in the bottom-right corner.');
  } else if (view === 'favorites'){
    const f = Store.get('fav');
    f.length ? renderSection('Favorites', f) : showEmpty('No Favorites Yet','Tap the heart on any card to keep it here.');
  } else if (view === 'history'){
    renderHistoryView();
  } else {
    const f = allMovies.filter(m => m.type === view);
    f.length ? renderSection(view === 'movies' ? 'Movies' : 'Series', f.slice(0, 100))
      : showEmpty('Empty', 'No ' + view + ' cached yet — run a sync.');
  }
}
function renderHistoryView(){
  const h = Store.get('hist');
  if (!h.length) return showEmpty('Nothing Watched Yet','Titles you open will appear here with your latest episode and watch time.');
  hideEmpty();
  $('sections').innerHTML = '';
  const inProgress = h.filter(x => x.minutesWatched > 0 && progressPct(x) < 95);
  if (inProgress.length){
    $('sections').insertAdjacentHTML('beforeend',
      '<section aria-label="Continue watching"><div class="sec-head"><h2 class="sec-title">Continue Watching</h2></div>' +
      '<div class="grid">' + inProgress.slice(0,20).map(cardHTML).join('') + '</div></section>');
  }
  $('sections').insertAdjacentHTML('beforeend',
    '<section aria-label="All history"><div class="sec-head"><h2 class="sec-title">All History</h2></div>' +
    '<div class="grid">' + h.slice(0,20).map(cardHTML).join('') + '</div></section>');
  revealCards();
}
function showEmpty(title, desc){
  $('emptyTitle').textContent = title;
  $('emptyDesc').textContent = desc;
  $('empty').style.display = 'flex';
}
function hideEmpty(){ $('empty').style.display = 'none'; }

function renderSections(movies){
  const bar = $('catbar');
  const genres = [...new Set(movies.map(m => m.genre).filter(Boolean))].sort();
  bar.innerHTML =
    '<button class="catpill ' + (cat==='all'?'active':'') + '" data-cat="all">All</button>' +
    genres.map(g => '<button class="catpill ' + (cat===g?'active':'') + '" data-cat="' + esc(g) + '">' + esc(g) + '</button>').join('');
  bar.querySelectorAll('.catpill').forEach(p =>
    p.addEventListener('click', () => { cat = p.dataset.cat; switchView('home'); }));

  $('sections').innerHTML = ''; hideEmpty();
  $('catbar').style.display = 'flex';

  if (cat === 'all'){
    [['Movies','movies'],['Series','series']].forEach(pair => {
      const items = movies.filter(m => m.type === pair[1]).slice(0,20);
      if (items.length) renderSection(pair[0], items);
    });
  } else {
    const list = movies.filter(m => m.genre === cat).slice(0,20);
    if (!list.length) return showEmpty('Nothing Here', 'No titles in "' + cat + '" yet.');
    renderSection(cat, list);
  }
}

/* ═══════════ Cards ═══════════ */
function skel(n){
  n = n || 20;
  let out = '';
  for (let i=0;i<n;i++) out += '<div class="skel-card"><div class="skel-img"></div><div class="skel-line"></div><div class="skel-line s"></div></div>';
  return out;
}
function cardHTML(m){
  const fav = Store.has('fav', m.id);
  const hist = Store.find('hist', m.id);
  const isTV = m.type === 'series';
  const pct = progressPct(hist);

  const chip = (isTV && hist && hist.season)
    ? '<span class="ep-chip">S' + hist.season + ' · E' + (hist.episode || 1) + '</span>'
    : '';

  const prog = pct > 0
    ? '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
    : '';

  const metaRight = (hist && hist.minutesWatched)
    ? esc(fmtMinutes(hist.minutesWatched))
    : esc(m.release_date || '—');

  return '<article class="card" role="button" tabindex="0" data-id="' + m.id + '" aria-label="' + esc(m.title) + '">' +
    '<div class="card-img-wrap">' +
      '<img src="' + (esc(m.poster) || PLACEHOLDER) + '" alt="" loading="lazy" class="card-img" onerror="imgFallback(this)">' +
      '<span class="badge-rate">★ ' + fmtRating(m.rating) + '</span>' +
      chip + prog +
      '<div class="card-overlay"><button class="playbtn" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button></div>' +
    '</div>' +
    '<button class="card-fav ' + (fav?'active':'') + '" data-fav="' + m.id + '" aria-label="Toggle favorite" aria-pressed="' + fav + '">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="' + (fav?'currentColor':'none') + '" stroke="currentColor" stroke-width="2.2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>' +
    '</button>' +
    '<div class="card-info"><div class="card-title">' + esc(m.title) + '</div>' +
    '<div class="card-meta"><span>' + metaRight + '</span></div></div>' +
  '</article>';
}
function revealCards(){
  requestAnimationFrame(() =>
    document.querySelectorAll('.card:not(.shown)').forEach((c,i) => {
      c.style.transitionDelay = Math.min(i*35, 350) + 'ms';
      c.classList.add('shown');
      c.addEventListener('transitionend', () => { c.style.transitionDelay = ''; }, { once:true });
    }));
}
function renderSection(title, movies){
  $('sections').insertAdjacentHTML('beforeend',
    '<section aria-label="' + esc(title) + '"><div class="sec-head"><h2 class="sec-title">' + esc(title) + '</h2></div>' +
    '<div class="grid">' + movies.map(cardHTML).join('') + '</div></section>');
  revealCards();
}

document.addEventListener('click', e => {
  const favBtn = e.target.closest('[data-fav]');
  if (favBtn){
    e.stopPropagation();
    const id = Number(favBtn.dataset.fav);
    const m = allMovies.find(x => x.id === id) || Store.get('fav').find(x => x.id === id) || Store.find('hist', id);
    if (m) toggleFav(m);
    return;
  }
  const card = e.target.closest('.card[data-id]');
  if (card) openDetail(Number(card.dataset.id));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card')){

/* ═══════════ Hero ═══════════ */
function initHero(items){
  const withBd = items.filter(m => m.backdrop);
  heroItems = (withBd.length >= 3 ? withBd : items)
    .slice().sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,6);
  if (!heroItems.length) return;

  $('heroDots').innerHTML = heroItems.map((_,i) =>
    '<button class="hero-dot ' + (i===0?'active':'') + '" data-i="' + i + '" aria-label="Slide ' + (i+1) + '"></button>').join('');
  $('heroDots').querySelectorAll('.hero-dot').forEach(d =>
    d.addEventListener('click', () => { changeHero(Number(d.dataset.i)); startAuto(); }));

  changeHero(0); startAuto();

  const hero = $('hero');
  hero.addEventListener('mouseenter', () => clearInterval(heroInterval));
  hero.addEventListener('mouseleave', startAuto);
}
function startAuto(){ clearInterval(heroInterval); heroInterval = setInterval(nextHero, 8000); }
function stopHero(){ clearInterval(heroInterval); heroItems = []; }
function changeHero(i){
  heroIndex = i;
  const bd = $('heroBackdrop');
  bd.classList.add('fade');
  setTimeout(() => { renderHero(heroItems[i]); bd.classList.remove('fade'); }, 280);
  $('heroDots').querySelectorAll('.hero-dot').forEach((d,j) => d.classList.toggle('active', j===i));
}
function nextHero(){ if (heroItems.length) changeHero((heroIndex+1)%heroItems.length); }
function prevHero(){ if (heroItems.length) changeHero((heroIndex-1+heroItems.length)%heroItems.length); }

function renderHero(m){
  if (!m) return;
  $('heroBackdrop').style.backgroundImage = 'url("' + (m.backdrop || m.poster || '') + '")';
  $('heroTitle').textContent = (m.title||'').toUpperCase();
  $('heroMeta').innerHTML =
    '<span class="star">★ ' + fmtRating(m.rating) + '</span><span class="dot"></span>' +
    '<span>' + esc(m.release_date||'') + '</span><span class="dot"></span><span>' + esc(m.genre||'') + '</span>';
  $('heroDesc').textContent = m.overview || '';
  const favLabel = Store.has('fav', m.id) ? '♥ Saved' : '♡ Favorite';
  $('heroActs').innerHTML =
    '<button class="btn btn-lava" onclick="openDetail(' + m.id + ')">▶ Watch Now</button>' +
    '<button class="btn btn-ghost" onclick="toggleFavById(' + m.id + ')">' + favLabel + '</button>';
  $('hero').classList.add('visible');
}

function toggleFavById(id){
  const m = allMovies.find(x => x.id === id) || Store.find('hist', id) || currentMovie;
  if (!m) return;
  toggleFav(m);
  if (heroItems.length) renderHero(heroItems[heroIndex]);
  if (currentMovie && currentMovie.id === id) renderFavBtn();
  toast(Store.has('fav', id) ? 'Added to favorites ♥' : 'Removed from favorites');
}
function toggleFav(m){ Store.toggle('fav', m); refreshFavButtons(m.id); }
function refreshFavButtons(id){
  const fav = Store.has('fav', id);
  document.querySelectorAll('[data-fav="' + id + '"]').forEach(b => {
    b.classList.toggle('active', fav);
    b.setAttribute('aria-pressed', fav);
    const svg = b.querySelector('svg');
    if (svg) svg.setAttribute('fill', fav ? 'currentColor' : 'none');
  });
}

/* ═══════════ Search ═══════════ */
let searchTimer = null, searchToken = 0;
function initSearch(){
  const input = $('searchInput'), dd = $('searchDropdown');
  input.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if (q.length < 2) return closeDD();
    searchTimer = setTimeout(() => runSearch(q), 250);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); const f = dd.querySelector('.search-item'); if (f) f.focus(); }
    else if (e.key === 'Escape') closeDD();
  });
  dd.addEventListener('keydown', e => {
    const items = [...dd.querySelectorAll('.search-item')];
    const idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); if (items[idx+1]) items[idx+1].focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); idx===0 ? input.focus() : (items[idx-1] && items[idx-1].focus()); }
    else if (e.key === 'Escape') closeDD();
  });
  document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) closeDD(); });

  function closeDD(){ dd.style.display='none'; dd.innerHTML=''; }

  async function runSearch(q){
    const token = ++searchToken;
    dd.innerHTML = '<div class="search-item"><div class="search-item-title">Searching…</div></div>';
    dd.style.display = 'block';
    try{
      const r = await fetch(API_BASE + '/search?q=' + encodeURIComponent(q));
      if (token !== searchToken) return;
      const res = await r.json().catch(() => []);
      if (!Array.isArray(res) || !res.length){
        dd.innerHTML = '<div class="search-item"><div class="search-item-title">No results found</div></div>';
        return;
      }
      dd.innerHTML = res.map(m => {
        const label = m.type === 'series' ? 'Series' : 'Movie';
        return '<button class="search-item" role="option" data-id="' + m.id + '">' +
          '<img src="' + (esc(m.poster) || PLACEHOLDER) + '" alt="" onerror="imgFallback(this)">' +
          '<div style="min-width:0;"><div class="search-item-title">' + esc(m.title) + '</div>' +
          '<div class="search-item-meta"><span class="type-tag">' + label + '</span>' + esc(m.release_date||'') + ' · ★ ' + fmtRating(m.rating) + '</div></div></button>';
      }).join('');
      dd.querySelectorAll('.search-item[data-id]').forEach(el =>
        el.addEventListener('click', () => { openDetail(Number(el.dataset.id)); input.value=''; closeDD(); }));
    }catch(err){
      if (token !== searchToken) return;
      dd.innerHTML = '<div class="search-item"><div class="search-item-title">Search failed. Try again.</div></div>';
    }
  }
}

/* ═══════════ Detail portal ═══════════ */
async function openDetail(id){
  const local = allMovies.find(m => m.id === id)
    || Store.get('fav').find(m => m.id === id)
    || Store.find('hist', id);
  currentMovie = local || { id: id, title: 'Loading…', type: '' };
  dynamicSources = [];
  seasons = []; activeSeason = 1; activeEpisode = 1;

  renderDetail(currentMovie);
  renderResume(local);
  $('castSection').style.display = 'none';
  $('providerGrid').innerHTML = '';
  $('watchNote').textContent = '';
  $('serverGrid').innerHTML = '';
  $('episodesSection').style.display = 'none';
  showVideoPlaceholder('Select a server below to start watching.');
  removeEmbed();

  $('portal').classList.add('on');
  document.body.style.overflow = 'hidden';
  $('closeBtn').focus();

  const full = await api('/movie/' + id);
  if (full){
    currentMovie = full;
    renderDetail(full);
    recordProgress({});
    renderResume(Store.find('hist', id));
  } else {
    $('serverGrid').innerHTML = '<p class="src-note">Could not load details. Close and try again.</p>';
  }

  if (full && full.type === 'series'){
    $('episodesSection').style.display = 'block';
    activeSeason = Number(local && local.season) || 1;
    activeEpisode = Number(local && local.episode) || 1;
    seasons = await api('/seasons/' + full.id) || [];
    renderSeasons();
  }
  loadSources();
  renderProviders(full);
  renderCast(full);
}

function renderDetail(m){
  $('portalTitle').textContent = m.title || 'Details';
  $('detailTitle').textContent = m.title || 'Unknown Title';
  const p = $('detailPoster');
  p.src = m.poster || PLACEHOLDER;
  p.onerror = function(){ imgFallback(this); };
  const typeLabel = m.type === 'series' ? 'Series' : 'Movie';
  $('detailMeta').innerHTML =
    '<span class="type-big">' + typeLabel + '</span>' +
    '<span class="star">★ ' + fmtRating(m.rating) + '</span>' +
    '<span>' + esc(m.release_date || 'N/A') + '</span>' +
    '<span>' + esc(m.genre || '') + '</span>';
  $('detailDesc').textContent = m.overview || 'No description available.';
  renderFavBtn();
}
function renderFavBtn(){
  const fav = currentMovie && Store.has('fav', currentMovie.id);
  $('favBtn').className = 'heart-btn' + (fav ? ' active' : '');
  $('favBtn').innerHTML =
    '<svg width="22" height="22" viewBox="0 0 24 24" fill="' + (fav?'currentColor':'none') + '" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';

 $('favBtn').addEventListener('click', () => {
  if (!currentMovie) return;
  toggleFav(currentMovie);
  renderFavBtn();
  toast(Store.has('fav', currentMovie.id) ? 'Added to favorites ♥' : 'Removed from favorites');

 $('closeBtn').addEventListener('click', closePortal);

/* Resume banner */
function renderResume(entry){
  const box = $('resumeBox');
  if (!entry || (!entry.season && !(entry.minutesWatched > 0))){ box.innerHTML = ''; return; }
  const pct = progressPct(entry);
  const head = entry.season
    ? '<span style="font-weight:700;">S' + entry.season + ' · E' + (entry.episode || 1) + '</span>'
    : '<span style="font-weight:700;">Resume</span>';
  box.innerHTML =
    '<div class="watch-section" style="padding:16px 20px;">' +
      '<div class="sub-head" style="font-size:11px;">Resume</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--fog);flex-wrap:wrap;gap:8px;">' +
        head +
        '<span style="color:var(--ash);">' + esc(fmtMinutes(entry.minutesWatched)) +
        (entry.runtime ? ' of ~' + entry.runtime + ' min' : '') + '</span>' +
      '</div>' +
      (pct > 0
        ? '<div class="progress-track" style="position:static;margin-top:6px;border-radius:2px;">' +
          '<div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<div style="font-size:11px;color:var(--dust);margin-top:4px;">' + pct + '% complete' + (pct >= 95 ? ' — finished!' : '') + '</div>'
        : '') +
    '</div>';
}

/* Record watch progress */
function recordProgress(extra){
  if (!currentMovie || !currentMovie.title || currentMovie.title === 'Loading…') return;
  const prev = Store.find('hist', currentMovie.id) || {};
  Store.add('hist', Object.assign({}, prev, currentMovie, {
    season: extra.season !== undefined ? extra.season : prev.season,
    episode: extra.episode !== undefined ? extra.episode : prev.episode,
    minutesWatched: extra.minutesWatched !== undefined ? extra.minutesWatched : (prev.minutesWatched || 0),
    runtime: extra.runtime || currentMovie.runtime || prev.runtime,
    ts: Date.now()
  }));
  refreshFavButtons(currentMovie.id);
}

/* Watch-time ticker */
function startWatchTimer(){
  stopWatchTimer();
  watchTimer = setInterval(() => {
    if (!currentMovie || !currentMovie.id) return;
    const h = Store.find('hist', currentMovie.id);
    if (h){
      h.minutesWatched = (h.minutesWatched || 0) + 1;
      h.ts = Date.now();
      Store.add('hist', h);
    } else {
      recordProgress({ minutesWatched: 1 });
    }
  }, 60000);
}
function stopWatchTimer(){ clearInterval(watchTimer); watchTimer = null; }

/* ═══════════ Player + servers ═══════════ */
async function loadSources(){
  if (!currentMovie || !currentMovie.id) return;
  const grid = $('serverGrid');
  grid.innerHTML = '<p class="src-note">Loading servers for S' + activeSeason + 'E' + activeEpisode + '…</p>';
  showVideoLoading('Loading servers for S' + activeSeason + 'E' + activeEpisode + '…');

  dynamicSources = await api('/sources?id=' + currentMovie.id + '&s=' + activeSeason + '&e=' + activeEpisode + '&type=' + encodeURIComponent(currentMovie.type || '')) || [];
  if (!Array.isArray(dynamicSources)) dynamicSources = [];

  if (!dynamicSources.length){
    grid.innerHTML = '<p class="src-note">No servers available for this title.</p>';
    showVideoPlaceholder('No servers available. Try another title.');
    return;
  }

  grid.innerHTML = dynamicSources.map(s =>
    '<button class="server-btn" data-name="' + esc(s.name) + '">' + esc(s.name) + '</button>').join('');
  const btns = grid.querySelectorAll('.server-btn');
  btns.forEach(b => b.addEventListener('click', () => selSrc(b, b.dataset.name)));

  const idx = Math.max(0, dynamicSources.findIndex(s => s.name === preferredSource));
  if (btns[idx]) selSrc(btns[idx], dynamicSources[idx].name);
}

async function selSrc(btn, name){
  if (!btn) return;
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  preferredSource = name;

  const source = dynamicSources.find(s => s.name === name);
  if (!source || !source.url){ showVideoPlaceholder('This server is unavailable.'); return; }

  showVideoLoading('Checking ' + name + '…');

  // X-Frame-Options / CSP check still matters: headers block ANY iframe,
  // even nested inside srcdoc — those providers go to the popup path.
  let frameable = true;
  try{
    const r = await fetch(API_BASE + '/check-frameable?url=' + encodeURIComponent(source.url));
    const data = await r.json();
    frameable = !!data.frameable;
  }catch(e){ frameable = true; }

  const vframe = $('vframe');
  removeEmbed();

  if (frameable){
    /* ════════════════════════════════════════════════════════════
       MATRYOSHKA PLAYER (PrimeWire pattern)
       Outer iframe → sandboxed srcdoc wrapper (opaque origin)
       Inner iframe → the real provider URL
       ════════════════════════════════════════════════════════════ */
    const wrapper =
      '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style>' +
      'html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}' +
      'iframe{width:100%;height:100%;border:0;display:block}' +
      '</style></head><body>' +
      '<iframe src="' + source.url.replace(/"/g, '&quot;') + '" allowfullscreen webkitallowfullscreen="true" scrolling="no"></iframe>' +
      '</body></html>';

    const iframe = document.createElement('iframe');
    iframe.className = 'sp-player';
    iframe.title = (currentMovie && currentMovie.title) ? currentMovie.title : 'Player';
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    // Exact flag set from the reference — duplicate allow-popups kept verbatim
    iframe.setAttribute('sandbox', 'allow-popups allow-top-navigation-by-user-activation allow-scripts allow-modals allow-popups allow-downloads allow-pointer-lock allow-presentation');
    iframe.style.cssText = 'width:100%;height:100%;border:0;display:block;background:#000';
    iframe.srcdoc = wrapper;
    iframe.addEventListener('load', hideVideoLoading); // fires when inner iframe finishes too

    showVideoLoading('Connecting to ' + name + '…');
    vframe.appendChild(iframe);
  } else {
    const win = openCenteredPopup(source.url);
    if (win){
      win.focus();
      showVideoNotice(
        '<p class="big">' + esc(name) + ' doesn\u2019t allow embedding.</p>' +
        '<p>Opened in a companion window \u2713</p>' +
        '<p><a href="' + esc(source.url) + '" target="_blank" rel="noopener noreferrer">Open the window again</a></p>'
      );
    } else {
      showVideoNotice(
        '<p class="big">' + esc(name) + ' can\u2019t be embedded here.</p>' +
        '<p>Your browser blocked the popup window.</p>' +
        '<p><a href="' + esc(source.url) + '" target="_blank" rel="noopener noreferrer">\u25B6 Click to open ' + esc(name) + '</a></p>'
      );
    }
  }
  startWatchTimer();
}

function openCenteredPopup(url){
  try{
    const sw = (window.screen && window.screen.width) || 1280;
    const sh = (window.screen && window.screen.height) || 800;
    const w = Math.min(1100, Math.round(sw * 0.85));
    const h = Math.min(700, Math.round(sh * 0.85));
    const left = Math.max(0, Math.round((sw - w) / 2));
    const top = Math.max(0, Math.round((sh - h) / 2));
    return window.open(url, '_blank',
      'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
  }catch(e){ return null; }
}

let videoLoadTimer = null;
function showVideoLoading(msg){
  const ph = $('vplaceholder');
  ph.style.display = 'flex';
  ph.innerHTML = '<div class="spinner"></div><p>' + esc(msg || 'Loading…') + '</p>';
  clearTimeout(videoLoadTimer);
  videoLoadTimer = setTimeout(() => {
    if (ph.style.display !== 'none'){
      ph.innerHTML = '<p>Still loading… this server may be down — try another below.</p>';
    }
  }, 12000);
}
function hideVideoLoading(){
  clearTimeout(videoLoadTimer);
  $('vplaceholder').style.display = 'none';
}
function showVideoPlaceholder(msg){
  clearTimeout(videoLoadTimer);
  const ph = $('vplaceholder');
  ph.style.display = 'flex';
  ph.innerHTML = '<p>' + esc(msg) + '</p>';
}
function showVideoNotice(html){
  clearTimeout(videoLoadTimer);
  const ph = $('vplaceholder');
  ph.style.display = 'flex';
  ph.innerHTML = html;
}

/* ═══════════ Episodes ═══════════ */
function renderSeasons(){
  $('seasonsBar').innerHTML = seasons.map(s =>
    '<button class="season-pill ' + (s.season_number === activeSeason ? 'active' : '') + '" data-season="' + s.season_number + '">S' + s.season_number +
    (s.name ? ' · ' + esc(String(s.name).replace(/^Season\s*/i,'')) : '') + '</button>').join('');
  $('seasonsBar').querySelectorAll('.season-pill').forEach(p =>
    p.addEventListener('click', () => {
      activeSeason = Number(p.dataset.season);
      activeEpisode = 1;
      renderSeasons();
    }));
  renderEpisodesList();
}
function renderEpisodesList(){
  const grid = $('episodesGrid'), note = $('epNote');
  const s = seasons.find(x => x.season_number === activeSeason);
  const count = (s && s.episode_count) || 0;

  if (!count){
    grid.innerHTML = '';
    note.textContent = 'No episode data available yet.';
    return;
  }
  note.textContent = 'Pick an episode — your latest one and watch time are remembered.';
  let html = '';
  for (let ep = 1; ep <= count; ep++){
    html += '<button class="ep-btn' + (ep === activeEpisode ? ' selected' : '') + '" data-ep="' + ep + '">E' + ep + '</button>';
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.ep-btn').forEach(b =>
    b.addEventListener('click', () => {
      grid.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      activeEpisode = Number(b.dataset.ep);
      recordProgress({ season: activeSeason, episode: activeEpisode, minutesWatched: 0 });
      toast('Loading S' + activeSeason + ' · E' + activeEpisode);
      loadSources();
      renderResume(Store.find('hist', currentMovie.id));
      $('playerSection').scrollIntoView({ behavior:'smooth', block:'start' });
    }));
}

/* ═══════════ Providers + Cast ═══════════ */
async function renderProviders(movie){
  const grid = $('providerGrid'), note = $('watchNote');
  if (!movie){ grid.innerHTML = ''; note.textContent = ''; return; }
  note.textContent = 'Checking availability…';
  const data = await api('/providers?id=' + movie.id);
  if (!data){ grid.innerHTML = ''; note.textContent = ''; return; }
  const region = data.link_country || 'US';
  const results = (data.results && data.results[region]) || {};
  const flat = results.flat || [], rent = results.rent || [];
  if (!flat.length && !rent.length){
    grid.innerHTML = '';
    note.textContent = 'Not listed on streaming services right now.';
    return;
  }
  grid.innerHTML = flat.concat(rent).slice(0,8).map(p => {
    const logo = p.logo_path
      ? '<img class="provider-logo" src="https://image.tmdb.org/t/p/w92' + esc(p.logo_path) + '" alt="">'
      : '';
    return '<a class="provider-btn" href="' + esc(p.url || '#') + '" target="_blank" rel="noopener noreferrer">' + logo + '▶ ' + esc(p.provider_name) + '</a>';
  }).join('');
  note.textContent = 'Official platform links (region: ' + region + ').';
}

async function renderCast(movie){
  if (!movie) return;
  const credits = await api('/credits/' + movie.id);
  const cast = (credits && credits.cast) || [];
  if (credits && credits.runtime && currentMovie){
    currentMovie.runtime = credits.runtime;
    const h = Store.find('hist', currentMovie.id);
    if (h && !h.runtime){ h.runtime = credits.runtime; Store.add('hist', h); }
  }
  if (!cast.length){ $('castSection').style.display = 'none'; return; }
  $('castSection').style.display = 'block';
  $('castRow').innerHTML = cast.map(c =>
    '<div class="cast-card">' +
      '<img src="' + (c.profile_path ? 'https://image.tmdb.org/t/p/w185' + esc(c.profile_path) : PLACEHOLDER) + '" alt="" loading="lazy" onerror="imgFallback(this)">' +
      '<div class="cast-name">' + esc(c.name) + '</div>' +
      '<div class="cast-role">' + esc(c.character || '') + '</div>' +
    '</div>').join('');
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

  document.addEventListener('keydown', e => {
    if ($('portal').classList.contains('on')){

      return;
    }
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') nextHero();
    if (e.key === 'ArrowLeft') prevHero();

  });
}
function closePortal(){

  document.body.style.overflow = '';
  removeEmbed();

  $('resumeBox').innerHTML = '';

}

/* ═══════════ Sync panel (always-on sync) ═══════════ */
let syncIsRunning = false;
function initSyncPanel(){
  $('syncPanel').style.display = 'block';
  $('syncBtn').addEventListener('click', async () => {
    const btn = $('syncBtn');
    btn.disabled = true;
    if (syncIsRunning){
      btn.innerText = 'Stopping…';
      try{ await fetch(API_BASE + '/stop-sync', { method: 'POST' }); }catch(e){}
    } else {
      btn.innerText = 'Starting…';
      try{ await fetch(API_BASE + '/start-sync'); }catch(e){}
    }
    checkSyncStatus();
  });
  checkSyncStatus();
}
let syncInterval = null;
async function checkSyncStatus(){
  clearInterval(syncInterval);
  syncInterval = setInterval(async () => {
    try{
      const r = await fetch(API_BASE + '/sync-status');
      const data = await r.json();
      const btn = $('syncBtn'), txt = $('syncStatusText');
      syncIsRunning = !!data.isSyncing;
      if (data.isSyncing){
        const yr = data.year ? ' · ' + data.year : '';
        const pg = data.page || data.currentPage || 0;
        txt.innerHTML = 'Status: Syncing <b>' + esc(data.category) + esc(yr) + '</b><br>Page: ' + pg +
          '<br>DB Items: ' + data.totalItems +
          '<br>Auto: every ' + (data.autoIntervalHours || 6) + 'h';
        btn.disabled = false; btn.innerText = 'Stop Sync';
      } else {
        const last = data.lastRunAt ? new Date(data.lastRunAt).toLocaleString() : 'never';
        const next = data.nextRunAt ? new Date(data.nextRunAt).toLocaleTimeString() : '—';
        txt.innerHTML = 'Status: Idle · last run: ' + esc(last) +
          '<br>DB Items: ' + data.totalItems +
          '<br>Next auto-sync: ' + esc(next);
        btn.disabled = false; btn.innerText = 'Start Full Sync';
      }
    }catch(e){}
  }, 2000);
}

checkAuth();
</script>
</body>
</html>
